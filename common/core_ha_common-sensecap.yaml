sensor:
  - platform: homeassistant
    id: ha_fr_fan_pct
    entity_id: ${ent_fr_fan}
    attribute: ${attr_percentage}
    internal: true
  - platform: homeassistant
    id: ha_mbr_fan_pct
    entity_id: ${ent_mbr_fan}
    attribute: ${attr_percentage}
    internal: true
  - platform: homeassistant
    id: ha_fr_lights_brightness
    entity_id: ${ent_fr_lights}
    attribute: ${attr_brightness}
    internal: true

  - platform: template
    id: ha_tstat_current_temp
    internal: true
    update_interval: never
    lambda: |-
      static float last_valid = 66.0f;
      std::string s = id(ha_tstat_current_temp_txt).state;
      if (s.empty() || s == "None" || s == "none" || s == "unknown" || s == "unavailable") return last_valid;
      char* end = nullptr;
      float v = strtof(s.c_str(), &end);
      if (end == s.c_str() || std::isnan(v) || std::isinf(v)) return last_valid;
      if (v < 40.0f || v > 90.0f) {
        ESP_LOGW("tstat_sync", "Ignoring out-of-range current temp %.1f from HA text state '%s'", v, s.c_str());
        return last_valid;
      }
      last_valid = v;
      return v;

  - platform: template
    id: ha_tstat_target_temp
    internal: true
    update_interval: never
    lambda: |-
      static float last_valid = 68.0f;
      std::string s = id(ha_tstat_target_temp_txt).state;
      if (s.empty() || s == "None" || s == "none" || s == "unknown" || s == "unavailable") return last_valid;
      float v = atof(s.c_str());
      if (std::isnan(v)) return last_valid;
      static std::string last_bad;
      if (v < 50.0f || v > 85.0f) {
        if (s != last_bad) {
          ESP_LOGW("tstat_sync", "Ignoring out-of-range target temp %.1f from HA text state '%s'", v, s.c_str());
          last_bad = s;
        }
        return last_valid;
      }
      last_bad.clear();
      last_valid = v;
      return v;

