# FILE EDIT GUIDE (SenseCAP)
# Role: Shared defaults/tokens/mappings/include wiring.
# Update here for:
# - Color tokens and family palettes (common/color-*.yaml).
# - UI defaults and entity attributes (common/ha_entities-*.yaml).
# - Global runtime/state controls (intervals, globals, boot/runtime hooks).
# - Page-to-entity mapping controls when used by this file.
# Page files should consume these defaults via ui_* vars and page-level overrides.
# Avoid hardcoded page layout geometry in common files.
text_sensor:
  - platform: homeassistant
    id: ha_osat_temp_txt
    entity_id: ${ent_osat_temp}
    internal: true
  
  - platform: homeassistant
    id: ha_kitchen_temp_txt
    entity_id: ${ent_kitchen_temp}
    internal: true
  
  - platform: homeassistant
    id: ha_freezer_temp_txt
    entity_id: ${ent_freezer_temp}
    internal: true
  
  - platform: homeassistant
    id: ha_fridge_temp_txt
    entity_id: ${ent_fridge_temp}
    internal: true

sensor:
  - platform: template
    id: ha_osat_temp
    internal: true
    lambda: |-
      std::string s = id(ha_osat_temp_txt).state;
      if (s.empty() || s == "None" || s == "none" || s == "unknown" || s == "unavailable") return NAN;
      char* end = nullptr;
      float v = strtof(s.c_str(), &end);
      if (end == s.c_str() || std::isnan(v) || std::isinf(v)) return NAN;
      return v;
    filters:
      - filter_out: nan

