substitutions:
  # Home page slot mapping (entity + display behavior)
  ui_home_dani_entity_id: "${ent_dani_mode_on}"
  ui_home_dani_text: "${ui_dani_text}"
  ui_home_dani_icon: "${ui_dani_icon}"
  ui_home_dani_on_bg: "${ui_dani_on_bg}"
  ui_home_dani_off_bg: "${ui_dani_off_bg}"
  ui_home_dani_on_icon: "${ui_dani_on_icon}"
  ui_home_dani_off_icon: "${ui_dani_off_icon}"
  ui_home_dani_value_on: "${ui_dani_value_on}"
  ui_home_dani_value_off: "${ui_dani_value_off}"
  ui_home_dani_icon_on_color: "$icon_on_color"
  ui_home_dani_icon_off_color: "sense_text_muted"
  ui_home_dani_text_on_color: "white"
  ui_home_dani_text_off_color: "white"
  ui_home_dani_value_on_color: "white"
  ui_home_dani_value_off_color: "white"
  ui_home_dani_show_icon: "true"
  ui_home_dani_show_text: "true"
  ui_home_dani_show_value: "true"

  ui_home_sleepy_entity_id: "${ent_sleepy_toggle}"
  ui_home_sleepy_text: "${ui_sleepy_text}"
  ui_home_sleepy_icon: "${ui_sleepy_icon}"
  ui_home_sleepy_on_bg: "${ui_sleepy_on_bg}"
  ui_home_sleepy_off_bg: "${ui_sleepy_off_bg}"
  ui_home_sleepy_on_icon: "${ui_sleepy_on_icon}"
  ui_home_sleepy_off_icon: "${ui_sleepy_off_icon}"
  ui_home_sleepy_value_on: "${ui_sleepy_value_on}"
  ui_home_sleepy_value_off: "${ui_sleepy_value_off}"
  ui_home_sleepy_icon_on_color: "$icon_on_color"
  ui_home_sleepy_icon_off_color: "sense_text_muted"
  ui_home_sleepy_text_on_color: "white"
  ui_home_sleepy_text_off_color: "white"
  ui_home_sleepy_value_on_color: "white"
  ui_home_sleepy_value_off_color: "white"
  ui_home_sleepy_show_icon: "true"
  ui_home_sleepy_show_text: "true"
  ui_home_sleepy_show_value: "false"

  ui_home_bedtime_entity_id: "${ent_bedtime_toggle}"
  ui_home_bedtime_text: "${ui_bedtime_text}"
  ui_home_bedtime_icon: "${ui_bedtime_icon}"
  ui_home_bedtime_on_bg: "${ui_bedtime_on_bg}"
  ui_home_bedtime_off_bg: "${ui_bedtime_off_bg}"
  ui_home_bedtime_on_icon: "${ui_bedtime_on_icon}"
  ui_home_bedtime_off_icon: "${ui_bedtime_off_icon}"
  ui_home_bedtime_value_on: "${ui_bedtime_value_on}"
  ui_home_bedtime_value_off: "${ui_bedtime_value_off}"
  ui_home_bedtime_icon_on_color: "$icon_on_color"
  ui_home_bedtime_icon_off_color: "sense_text_muted"
  ui_home_bedtime_text_on_color: "white"
  ui_home_bedtime_text_off_color: "white"
  ui_home_bedtime_value_on_color: "white"
  ui_home_bedtime_value_off_color: "white"
  ui_home_bedtime_show_icon: "true"
  ui_home_bedtime_show_text: "true"
  ui_home_bedtime_show_value: "false"

  # Home page nav tile mapping (row 1)
  ui_home_tstat_icon: "$mdi_thermometer"
  ui_home_tstat_text: "Thermostat"
  ui_home_tstat_icon_color: "sense_bg"
  ui_home_tstat_text_color: "sense_bg"

  ui_home_fans_icon: "$mdi_fan"
  ui_home_fans_text: "Fans"
  ui_home_fans_icon_color: "white"
  ui_home_fans_text_color: "white"

  ui_home_overrides_icon: "$mdi_tune"
  ui_home_overrides_text: "Overrides"
  ui_home_overrides_icon_color: "sense_bg"
  ui_home_overrides_text_color: "sense_bg"

  # Home page placeholder mapping (row 2)
  ui_home_placeholder_icon: "$mdi_dots_horizontal"
  ui_home_placeholder_icon_color: "sense_tile_placeholder_text"
  ui_home_placeholder_text_color: "sense_tile_placeholder_text"
  ui_home_placeholder_1_text: "Placeholder 1"
  ui_home_placeholder_2_text: "Placeholder 2"
  ui_home_placeholder_3_text: "Placeholder 3"

  # Home page nav behavior mapping (row 1)
  ui_home_tstat_nav_script: "nav_to_tstat"
  ui_home_tstat_show: "true"
  ui_home_tstat_hidden: "false"

  ui_home_fans_nav_script: "nav_to_fans"
  ui_home_fans_show: "true"
  ui_home_fans_hidden: "false"

  ui_home_overrides_nav_script: "nav_to_overrides"
  ui_home_overrides_show: "true"
  ui_home_overrides_hidden: "false"
