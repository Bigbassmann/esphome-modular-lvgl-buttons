    - id: sense_primary
      hex: '1D4ED8'   # color for primary actions, highlights, etc. A vibrant blue that stands out and draws attention.
    - id: sense_info
      hex: 'FFFFFF'    # color for informational messages, tooltips, etc. Using white for clarity and neutrality.
    - id: sense_success
      hex: '166534'    # color for success messages, confirmations, etc. A rich green that conveys positivity and success.
    - id: sense_warn
      hex: 'F59E0B'    # color for warning messages, alerts, etc. A bright orange that signals caution without being too alarming.
    - id: sense_danger
      hex: 'EF4444'     # color for error messages, critical alerts, etc. A bold red that conveys urgency and importance.
    - id: sense_teal
      hex: '0F766E'     # color for secondary actions, accents, etc. A deep teal that complements the primary blue and adds variety to the palette.
    - id: sense_tile_green
      hex: '4CAF50'     # color for green tiles. A standard green that is easily recognizable and works well for indicating active or positive states.
    - id: sense_tile_green_off
      hex: '2F5F39'      # color for green tiles in the off state. A darker, desaturated version of the green to indicate inactivity while maintaining the hue.
    - id: sense_tile_orange
      hex: '8F3C42'       # color for orange tiles. A warm, muted orange that fits with the overall aesthetic and can be used for active states or accents.
    - id: sense_tile_orange_off
      hex: '571924'       # color for orange tiles in the off state. A darker, desaturated version of the orange to indicate inactivity while maintaining the hue.
    - id: sense_tile_yellow
      hex: '8F893C'       # color for yellow tiles. A warm, muted yellow that fits with the overall aesthetic and can be used for active states or accents.
    - id: sense_tile_yellow_off
      hex: '574C19'       # color for yellow tiles in the off state. A darker, desaturated version of the yellow to indicate inactivity while maintaining the hue.
    - id: sense_tile_blue
      hex: '3C6B8F'       # color for blue tiles. A cool, muted blue that fits with the overall aesthetic and can be used for active states or accents.
    - id: sense_tile_blue_off
      hex: '194357'       # color for blue tiles in the off state. A darker, desaturated version of the blue to indicate inactivity while maintaining the hue.  
    - id: sense_tile_red
      hex: '8F3C42'       # color for red tiles. A warm, muted red that fits with the overall aesthetic and can be used for active states or accents.
    - id: sense_tile_red_off
      hex: '571924'       # color for red tiles in the off state. A darker, desaturated version of the red to indicate inactivity while maintaining the hue.
    - id: sense_tile_teal
      hex: '3C8F89'       # color for teal tiles. A cool, muted teal that fits with the overall aesthetic and can be used for active states or accents.
    - id: sense_tile_teal_off
      hex: '19574C'       # color for teal tiles in the off state. A darker, desaturated version of the teal to indicate inactivity while maintaining the hue.
    - id: sense_tile_indigo
      hex: '3C428F'       # color for indigo tiles. A cool, muted indigo that fits with the overall aesthetic and can be used for active states or accents.
    - id: sense_tile_indigo_off
      hex: '192457'       # color for indigo tiles in the off state. A darker, desaturated version of the indigo to indicate inactivity while maintaining the hue.

    # Dani 6-family button palette matrix
    # Nomenclature:
    # - *_bg_on / *_bg_off: tile background colors
    # - *_slider_on / *_slider_off: slider indicator (filled) colors
    # - *_knob_on / *_knob_off: slider knob colors
    - id: dani_family_teal_bg_on
      hex: '3C8F89'     # color for teal-themed button backgrounds in the active state. A cool, muted teal that fits with the overall aesthetic and provides good contrast against the text and slider elements.
    - id: dani_family_teal_bg_off
      hex: '19574C'     # color for teal-themed button backgrounds in the inactive state. A darker, desaturated version of the teal to indicate inactivity while maintaining the hue.
    - id: dani_family_teal_text_on
      hex: 'FFFFFF'     # color for teal-themed button text in the active state. A bright white that provides good contrast against the background.
    - id: dani_family_teal_text_off
      hex: 'E0E0E0'     # color for teal-themed button text in the inactive state. A light gray that provides good contrast against the background while indicating inactivity.
