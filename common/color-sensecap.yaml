# FILE EDIT GUIDE (SenseCAP)
# Role: Shared defaults/tokens/mappings/include wiring.
# Update here for:
# - Color tokens and family palettes (common/color-*.yaml).
# - UI defaults and entity attributes (common/ha_entities-*.yaml).
# - Global runtime/state controls (intervals, globals, boot/runtime hooks).
# - Page-to-entity mapping controls when used by this file.
# Page files should consume these defaults via ui_* vars and page-level overrides.
# Avoid hardcoded page layout geometry in common files.

color:
    # SenseCAP-inspired palette (additive, non-breaking)
    # Dani dark top-level background palette options:
    # ACTIVE: 1B1A38 (dani dark blue) now Black 0D0D0D
    # ALT: 1A3738 (dani dark green)
    # ALT: 381B1A (dani dark red)
    # ALT: 37381A (dani dark yellow)
    - id: sense_bg
      hex: '0d0d0d'   # color for main background, previously '1B1A38' 
    - id: sense_surface
      hex: '1B1A38'     # color for main surfaces like cards, modals, etc. Consider using this for the main background if you want a more colorful look.
    - id: sense_surface_alt
      hex: '1A2838'     # color for alternate surfaces, like secondary cards, sidebars, etc. Provides a subtle contrast to the main surface.
    - id: sense_border
      hex: '374151'      # color for borders, dividers, etc. Provides separation between elements without being too harsh.
    - id: sense_text
      hex: 'E5E7EB'      # color for primary text. A light gray that stands out against the dark background without being pure white.
    - id: sense_text_muted
      hex: '9CA3AF'      # color for secondary text, hints, etc. A medium gray that is still readable but less prominent than the primary text.
    - id: dani_page_title
      hex: 'FFFFFF'      # color for page titles. Using pure white for maximum contrast and emphasis.
    - id: dani_page_text
      hex: 'FFFFFF'     # color for main page text. Using pure white to ensure readability against the dark background.
    - id: dani_page_text_muted
      hex: 'BDBDBD'     # color for muted page text. A light gray that is less prominent than the main text.
