# FILE EDIT GUIDE (SenseCAP)
# Role: Shared defaults/tokens/mappings/include wiring.
# Update here for:
# - Color tokens and family palettes (common/color-*.yaml).
# - UI defaults and entity attributes (common/ha_entities-*.yaml).
# - Global runtime/state controls (intervals, globals, boot/runtime hooks).
# - Page-to-entity mapping controls when used by this file.
# Page files should consume these defaults via ui_* vars and page-level overrides.
# Avoid hardcoded page layout geometry in common files.
