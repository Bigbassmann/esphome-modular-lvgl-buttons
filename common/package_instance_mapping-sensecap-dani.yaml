      dimmers_left_row1_hidden: ${ui_dimmers_p1_left_row1_hidden}
      dimmers_left_row2_uid: ${ui_dimmers_p1_left_row2_uid}
      dimmers_left_row2_hidden: ${ui_dimmers_p1_left_row2_hidden}
      dimmers_left_row3_uid: ${ui_dimmers_p1_left_row3_uid}
      dimmers_left_row3_hidden: ${ui_dimmers_p1_left_row3_hidden}
