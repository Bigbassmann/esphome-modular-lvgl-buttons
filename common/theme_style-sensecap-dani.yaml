  - platform: template
    name: "Current Theme"
    id: current_theme
    internal: true
    icon: mdi:theme-light-dark
    optimistic: true
    options:
      - Dark
      - Dani
      - Split
    initial_option: Dani
    on_value:
      then:
        - lambda: |-
            auto idx = id(current_theme).active_index();
