# FILE EDIT GUIDE (SenseCAP)
# Role: Shared defaults/tokens/mappings/include wiring.
# Update here for:
# - Color tokens and family palettes (common/color-*.yaml).
# - UI defaults and entity attributes (common/ha_entities-*.yaml).
# - Global runtime/state controls (intervals, globals, boot/runtime hooks).
# - Page-to-entity mapping controls when used by this file.
# Page files should consume these defaults via ui_* vars and page-level overrides.
# Avoid hardcoded page layout geometry in common files.
---
lvgl:
  page_wrap: true
  theme:
    obj:
      scrollbar_mode: "OFF"
      width: 100%
      height: 100%
      border_width: 0
      pad_all: 0
      radius: 0
      scrollable: false
      bg_opa: TRANSP
      bg_color: sense_surface
      # outline_width: 1
      # outline_color: red
    label:
      scrollbar_mode: "OFF"
      border_width: 0
      scrollable: false
      text_font: $text_font
      text_color: ${ui_base_label_off_color}
      # outline_width: 1
      # outline_color: red
    image:
      scrollbar_mode: "OFF"
      border_width: 0
      scrollable: false
      # outline_width: 1
      # outline_color: red
    button:
      scrollbar_mode: "OFF"
      width: 100%
      height: 100%
      border_width: 0
      radius: 25
      pad_all: 10
      shadow_width: 0  # Bug? - This is required even though the default is supposed to be 0.
      checkable: false
      press_lock: false
      scroll_on_focus: true
      bg_opa: cover
      bg_color: ${ui_base_button_off_color}
      # outline_width: 1
      # outline_color: red

  style_definitions:
    - id: page_style
      scrollbar_mode: "OFF"
      bg_color: sense_bg
      bg_opa: cover
      pad_all: 1

    - id: time_style
      scrollbar_mode: "OFF"
      text_font: $text_font
      text_color: ${ui_base_label_on_color}
      align: center

    # SenseCAP-inspired shell styles (additive)
    - id: sense_page_style
      scrollbar_mode: "OFF"
      bg_color: sense_bg
      bg_opa: cover
      pad_all: 0

    - id: sense_topbar_style
      bg_color: sense_bg
      bg_opa: cover
      border_width: 1
      border_color: sense_border
      radius: 0
      pad_left: 10
      pad_right: 10
      pad_top: 4
      pad_bottom: 4

    - id: sense_nav_bar_style
      bg_color: black
      bg_opa: cover
      border_width: 1
      border_color: sense_border
      radius: 0
      pad_left: 8
      pad_right: 8
      pad_top: 8
      pad_bottom: 8

    - id: sense_card_style
      bg_color: sense_surface
      bg_opa: cover
      border_width: 1
      border_color: sense_border
      radius: 8
      pad_all: 8

    - id: sense_nav_btn_style
      bg_color: sense_tile_blue
      bg_opa: cover
      text_color: sense_text
      border_width: 0
      border_color: sense_info
      radius: 8
      pad_all: 6

    - id: sense_tile_dani_style
      bg_color: sense_tile_red
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_sleepy_style
      bg_color: sense_tile_teal
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_bedtime_style
      bg_color: sense_tile_indigo
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_tstat_style
      bg_color: sense_tile_yellow
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_fans_style
      bg_color: dani_family_blue_bg_on
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_overrides_style
      bg_color: sense_tile_cyan
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_placeholder_style
      bg_color: sense_surface_alt
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_display_row_btn_style
      bg_color: sense_cat_admin
      bg_opa: cover
      text_color: sense_text
      border_width: 0
      radius: 8
      pad_all: 6

    - id: sense_card_flat_style
      bg_color: sense_bg
      bg_opa: cover
      border_width: 0
      radius: 8
      pad_all: 8

    - id: sense_menu_cat1_style
      bg_color: sense_cat_admin
      bg_opa: cover
      text_color: sense_text
      border_width: 0
      radius: 8
      pad_all: 6

    - id: sense_menu_cat2_style
      bg_color: sense_cat_climate
      bg_opa: cover
      text_color: sense_text
      border_width: 0
      radius: 8
      pad_all: 6

    - id: sense_menu_cat3_style
      bg_color: sense_cat_lights
      bg_opa: cover
      text_color: sense_text
      border_width: 0
      radius: 8
      pad_all: 6

    - id: sense_menu_cat4_style
      bg_color: sense_cat_overrides
      bg_opa: cover
      text_color: sense_text
      border_width: 0
      radius: 8
      pad_all: 6

globals:
  # Numeric theme slot (0-9 planned). Runtime logic should key off this slot,
  # not hardcoded theme names.
  - id: sense_theme_slot
    type: int
    restore_value: no
    initial_value: '1'
select:
  - platform: template
    name: "Current Theme"
    id: current_theme
    internal: true
    icon: mdi:theme-light-dark
    optimistic: true
    options:
      - Dark
      - Dani
      - Split
    initial_option: Dani
    on_value:
      then:
        - lambda: |-
            auto idx = id(current_theme).active_index();
            int raw = idx.has_value() ? (int) idx.value() : 0;
            id(sense_theme_slot) = (raw >= 0 && raw <= 9) ? raw : 0;
        - if:
            condition:
              - lambda: 'return id(sense_theme_slot) == 0;'
