# FILE EDIT GUIDE (SenseCAP)
# Role: Shared defaults/tokens/mappings/include wiring.
# Update here for:
# - Color tokens and family palettes (common/color-*.yaml).
# - UI defaults and entity attributes (common/ha_entities-*.yaml).
# - Global runtime/state controls (intervals, globals, boot/runtime hooks).
# - Page-to-entity mapping controls when used by this file.
# Page files should consume these defaults via ui_* vars and page-level overrides.
# Avoid hardcoded page layout geometry in common files.
---
lvgl:
  page_wrap: true
  theme:
    obj:
      scrollbar_mode: "OFF"
      width: 100%
      height: 100%
      border_width: 0
      pad_all: 0
      radius: 0
      scrollable: false
      bg_opa: TRANSP
      bg_color: theme_shell_surface
      # outline_width: 1
      # outline_color: red
    label:
      scrollbar_mode: "OFF"
      border_width: 0
      scrollable: false
      text_font: $text_font
      text_color: theme_page_text_muted
      # outline_width: 1
      # outline_color: red
    image:
      scrollbar_mode: "OFF"
      border_width: 0
      scrollable: false
      # outline_width: 1
      # outline_color: red
    button:
      scrollbar_mode: "OFF"
      width: 100%
      height: 100%
      border_width: 0
      radius: 25
      pad_all: 10
      shadow_width: 0  # Bug? - This is required even though the default is supposed to be 0.
      checkable: false
      press_lock: false
      scroll_on_focus: true
      bg_opa: cover
      bg_color: ${ui_base_button_off_color}
      # outline_width: 1
      # outline_color: red

  style_definitions:
    - id: page_style
      scrollbar_mode: "OFF"
      bg_color: theme_shell_bg
      bg_opa: cover
      pad_all: 1

    - id: time_style
      scrollbar_mode: "OFF"
      text_font: $text_font
      text_color: theme_page_text
      align: center

    - id: sense_text_title_style
      text_color: theme_page_title

    - id: sense_text_primary_style
      text_color: theme_page_text

    - id: sense_text_muted_style
      text_color: theme_page_text_muted

    # SenseCAP-inspired shell styles (additive)
    - id: sense_page_style
      scrollbar_mode: "OFF"
      bg_color: theme_shell_bg
      bg_opa: cover
      pad_all: 0

    - id: sense_topbar_style
      bg_color: theme_shell_bg
      bg_opa: cover
      border_width: 1
      border_color: theme_shell_border
      radius: 0
      pad_left: 10
      pad_right: 10
      pad_top: 4
      pad_bottom: 4

    - id: sense_nav_bar_style
      bg_color: theme_nav_bar_bg
      bg_opa: cover
      border_width: 1
      border_color: theme_shell_border
      radius: 0
      pad_left: 8
      pad_right: 8
      pad_top: 8
      pad_bottom: 8

    - id: sense_card_style
      bg_color: theme_shell_surface
      bg_opa: cover
      border_width: 1
      border_color: theme_shell_border
      radius: 8
      pad_all: 8

    - id: sense_nav_btn_style
      bg_color: theme_nav_btn_bg_default
      bg_opa: cover
      text_color: theme_nav_btn_text_default
      border_width: 0
      border_color: theme_nav_btn_text_default
      radius: 8
      pad_all: 6

    - id: sense_tile_dani_style
      bg_color: theme_tile_profile1_bg_default
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_sleepy_style
      bg_color: theme_tile_profile2_bg_default
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_bedtime_style
      bg_color: theme_tile_profile3_bg_default
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_tstat_style
      bg_color: theme_tile_climate_bg_default
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_fans_style
      bg_color: theme_tile_fans_bg_default
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_overrides_style
      bg_color: theme_tile_overrides_bg_default
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_tile_placeholder_style
      bg_color: theme_shell_alt
      bg_opa: cover
      border_width: 0
      radius: 10
      pad_all: 8

    - id: sense_display_row_btn_style
      bg_color: theme_display_row_btn_bg_default
      bg_opa: cover
      text_color: theme_display_row_btn_text_default
      border_width: 0
      radius: 8
      pad_all: 6

    - id: sense_card_flat_style
      bg_color: theme_shell_bg
      bg_opa: cover
      border_width: 0
      radius: 8
      pad_all: 8

    - id: sense_menu_cat1_style
      bg_color: theme_menu_cat1_bg_default
      bg_opa: cover
      text_color: theme_menu_cat1_text_default
      border_width: 0
      radius: 8
      pad_all: 6

    - id: sense_menu_cat2_style
      bg_color: theme_menu_cat2_bg_default
      bg_opa: cover
      text_color: theme_menu_cat2_text_default
      border_width: 0
      radius: 8
      pad_all: 6

    - id: sense_menu_cat3_style
      bg_color: theme_menu_cat3_bg_default
      bg_opa: cover
      text_color: theme_menu_cat3_text_default
      border_width: 0
      radius: 8
      pad_all: 6

    - id: sense_menu_cat4_style
      bg_color: theme_menu_cat4_bg_default
      bg_opa: cover
      text_color: theme_menu_cat4_text_default
      border_width: 0
      radius: 8
      pad_all: 6

globals:
  # Numeric theme slot (0-9 planned). Runtime logic should key off this slot,
  # not hardcoded theme names.
  - id: sense_theme_slot
    type: int
    restore_value: no
    initial_value: '1'
script:
  - id: sense_theme_refresh_page0_toggle_slots
    then:
      - if:
          condition:
            lambda: 'return id(sense_theme_slot) == 0;'
          then:
            - if:
                condition:
                  binary_sensor.is_on: widget_sensor_page0_slot0_state
                then:
                  - lvgl.widget.update: {id: page0_slot0_tile, bg_color: theme_slot0_blue_bg}
                  - lvgl.widget.update: {id: page0_slot0_icon, text_color: theme_slot0_blue_text}
                  - lvgl.widget.update: {id: page0_slot0_label, text_color: theme_slot0_blue_text}
                  - lvgl.widget.update: {id: page0_slot0_value, text_color: theme_slot0_blue_text}
                else:
                  - lvgl.widget.update: {id: page0_slot0_tile, bg_color: theme_slot0_nav_btn_bg}
                  - lvgl.widget.update: {id: page0_slot0_icon, text_color: theme_slot0_page_text}
                  - lvgl.widget.update: {id: page0_slot0_label, text_color: theme_slot0_page_text}
                  - lvgl.widget.update: {id: page0_slot0_value, text_color: theme_slot0_page_text}
