  # Page templates should consume ui_dani_* vars, not hardcoded icon tokens.
  ui_dani_icon: "\U000F078F"
  ui_dani_on_bg: "sense_tile_red"
  ui_dani_off_bg: "sense_tile_red_off"
  ui_dani_on_icon: "\U000F078F"
  ui_dani_off_icon: "\U000F078F"
  ui_dani_value_on: "ON"
  ui_dani_value_off: "OFF"
