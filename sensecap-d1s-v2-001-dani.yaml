---
# Substitution variables used through the codebase
substitutions:
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"

  ap_ssid: !secret ap_ssid
  ap_password: !secret ap_password
  ota_password: !secret ota_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  
  # SenseCAP display runtime defaults (dark-only, no Day/Evening/Night mode select)
  sense_display_brightness_pct: "50"
  sense_display_sleep_enabled: "true"
  sense_display_sleep_timeout_s: "60"

  # SenseCAP Phase 1 page routing
  sense_page_home_id: "page_home_v2"
  sense_page_menu_id: "page_menu"
  sense_page_wifi_id: "page_wifi_setup"
  sense_page_settings_id: "page_settings"
  sense_page_tstat_id: "page_thermostat_v2"
  sense_page_fans_id: "page_fans"
  sense_page_overrides_id: "page_overrides"
  sense_page_lighting_dimmers_id: "page_lighting_dimmers"
  sense_page_lighting_dimmers_2_id: "page_lighting_dimmers_2"
  sense_page_lighting_switches_id: "page_lighting_switches"
  sense_page_sensors_id: "page_sensors"
  sense_page_display_settings_id: "page_display_settings"
  # Template-safe demo entities for shared/main config
  demo_switch_entity: "switch.example_switch"
  demo_rgb_light_entity: "light.example_rgb_light"

esphome:
  name: "sensecap-d1s"
  friendly_name: "SenseCap D1S Git Test"
  comment: "SenseCap D1S Git Test"
  on_boot:
    - priority: 400
      then:
        - script.execute: update_loading_page

logger:
  level: debug

# Time update script - This is run once per second. Use it to update any time related labels.
script:
  - id: time_update
    then:
      # The format %I:%M %p will display the time in a 12-hour format with "am" or "pm" included
      - lvgl.label.update:
          id: time_label
          text: !lambda 'return id(system_time).now().strftime("%l:%M %P");'

packages:
  # secrets: !include secrets.yaml
  # Generic configuration for ESP32 screens
  # SDL has no Wi-Fi
  wifi: !include common/wifi-sensecap.yaml
  # Enable OTA updates with a status screen
  ota_screen: !include common/ota-sensecap.yaml
  # All the colors
  colors: !include common/color-sensecap-dani.yaml
  # Some nice basic fonts
  fonts: !include common/fonts-sensecap.yaml
  # 1000s of glyphs
  glyphs: !include common/mdi_glyph_substitutions.yaml
  # Some basic sensors
  sensors: !include sensors/sensors_base.yaml
  # Styles + Themes
  theme_style: !include common/theme_style-sensecap-dani.yaml
  ui_tokens_sensecap: !include common/ui_tokens-sensecap.yaml
  page_shell_sensecap: !include pages/page_shell_480-sensecap.yaml
  page_home_sensecap: !include pages/home_grid-sensecap.yaml
  page_menu_sensecap: !include pages/menu_grid-sensecap.yaml
  page_wifi_setup_sensecap: !include pages/wifi_setup-sensecap.yaml
  page_settings_sensecap: !include pages/settings_grid-sensecap.yaml
  page_display_settings_sensecap: !include pages/display_settings-sensecap-dani.yaml
  page_fans_sensecap: !include
    file: pages/fans_grid-sensecap.yaml
    vars:
      fan_inactive_color: gray
      fan_off_active_color: 0x3C428F
      fan_low_active_color: 0x3C8F89
      fan_med_active_color: 0x8F893C
      fan_high_active_color: 0x8F3C42
      fan_dir_reverse_color: 0x6870CC
