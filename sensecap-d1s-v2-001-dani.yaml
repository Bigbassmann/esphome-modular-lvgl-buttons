      dimmers_left_row3_text: ${ui_dimmers_left_row3_text}
      dimmers_left_row3_icon: ${ui_dimmers_left_row3_icon}
      dimmers_left_row3_on_bg: ${ui_dimmers_left_row3_on_bg}
      dimmers_left_row3_off_bg: ${ui_dimmers_left_row3_off_bg}
