# FILE EDIT GUIDE (SenseCAP)
# Role: Shared top/bottom navigation widgets.
# Update here for:
# - Shared nav button styling (bg/text/font/radius) via tokens.
# - Shared actions/scripts tied to nav buttons.
# - Show/hide behavior that should apply across pages.
# Keep per-page geometry/layout overrides in individual page files.
obj:
  id: sense_bottom_nav
  align: BOTTOM_MID
  x: 0
  y: 0
  width: 100%
  height: ${sense_nav_h | default("68")}
  styles: sense_nav_bar_style
  bg_color: theme_nav_bar_bg
  border_width: 0
  widgets:
    - button:
        id: prev_button
        align: BOTTOM_LEFT
        x: 4
        y: -2
        width: 96
        height: 50
        styles: sense_nav_btn_style
        on_press:
          - script.execute: nav_to_prev
        widgets:
          - label:
              text: "Prev"
              align: CENTER
              text_font: nunito_14
              styles: sense_text_primary_style

    - button:
        id: home_button
        align: BOTTOM_MID
        x: -58
        y: -2
        width: 108
        height: 50
        styles: sense_nav_btn_style
        on_press:
          - script.execute: nav_to_home
        widgets:
          - label:
              text: "Home"
              align: CENTER
              text_font: nunito_14
              styles: sense_text_primary_style

    - button:
        id: menu_button
        align: BOTTOM_MID
        x: 58
        y: -2
        width: 108
        height: 50
        styles: sense_nav_btn_style
        on_press:
          - script.execute: nav_to_menu
        widgets:
          - label:
              text: "Menu"
              align: CENTER
              text_font: nunito_14
              styles: sense_text_primary_style

    - button:
        id: next_button
        align: BOTTOM_RIGHT
        x: -4
        y: -2
        width: 96
        height: 50
        styles: sense_nav_btn_style
        on_press:
          - script.execute: nav_to_next
        widgets:
          - label:
              text: "Next"
              align: CENTER
              text_font: nunito_14
              styles: sense_text_primary_style

