---
# Swipe navigation
on_swipe_right:
    - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
    - logger.log: "Swipe right"
    - script.execute: nav_to_next
on_swipe_left:
    - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
    - logger.log: "Swipe left"
    - script.execute: nav_to_prev
