substitutions:
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"

packages:
  hardware: !include hardware/sensecap-d1s.yaml
  wifi: !include common/wifi.yaml
  colors: !include common/color.yaml
  theme_style: !include common/theme_style.yaml
  ui_tokens: !include common/ui_tokens_sensecap.yaml
  page_shell: !include pages/page_shell_480.yaml
  page_menu: !include pages/menu_grid.yaml
  page_wifi: !include pages/wifi_setup.yaml

api:

font:
  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_24
    size: 24
    bpp: 8
  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_20
    size: 20
    bpp: 8
  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_18
    size: 18
    bpp: 8
  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_14
    size: 14
    bpp: 8

lvgl:
  pages:
    - id: main_page
      styles: sense_page_style
      widgets:
        - obj:
            align: TOP_MID
            y: ${sense_content_y}
            width: 100%
            height: ${sense_content_h}
            styles: sense_card_style
            widgets:
              - label:
                  text: "Home"
                  align: CENTER
                  text_font: nunito_24
                  text_color: sense_text

