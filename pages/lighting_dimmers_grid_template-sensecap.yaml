            - lvgl.widget.update:
                id: icon_${dimmers_left_row2_uid}
                text_color: ${ui_base_icon_on_color}
            - lvgl.widget.update:
                id: label_${dimmers_left_row2_uid}
                text_color: ${ui_base_label_on_color}
          else:
            - lvgl.widget.update:
                id: button_${dimmers_left_row2_uid}
                bg_color: ${dimmers_left_row2_off_bg}
            - lvgl.widget.update:
                id: icon_${dimmers_left_row2_uid}
                text_color: ${ui_base_icon_off_color}
            - lvgl.widget.update:
                id: label_${dimmers_left_row2_uid}
                text_color: ${ui_base_label_off_color}

  - id: widget_sensor_${dimmers_left_row3_uid}
    platform: homeassistant
    entity_id: ${dimmers_left_row3_entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_${dimmers_left_row3_uid}
          then:
            - lvgl.widget.update:
                id: button_${dimmers_left_row3_uid}
                bg_color: ${dimmers_left_row3_on_bg}
            - lvgl.widget.update:
                id: icon_${dimmers_left_row3_uid}
                text_color: ${ui_base_icon_on_color}
            - lvgl.widget.update:
                id: label_${dimmers_left_row3_uid}
                text_color: ${ui_base_label_on_color}
          else:
            - lvgl.widget.update:
                id: button_${dimmers_left_row3_uid}
                bg_color: ${dimmers_left_row3_off_bg}
            - lvgl.widget.update:
                id: icon_${dimmers_left_row3_uid}
                text_color: ${ui_base_icon_off_color}
            - lvgl.widget.update:
                id: label_${dimmers_left_row3_uid}
                text_color: ${ui_base_label_off_color}




