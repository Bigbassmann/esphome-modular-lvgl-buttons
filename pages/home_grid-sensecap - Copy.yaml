# =============================================================================
# PAGE EDIT GUIDE (SenseCAP)
# - Color tokens: common/color-sensecap-dani.yaml.
# - Entity/UI defaults (text/icon/value/on-off): common/ha_entities-sensecap-dani.yaml.
# - Page instance mapping (entity -> page row/column): common/package_instance_mapping-sensecap-dani.yaml.
# - Title defaults: ui_page_title_* tokens (top_level_lvgl_defualts-001-dani.yaml / ha_entities).
# - Size/shape/layout: edit this page's layout/grid_rows/grid_columns/pad_*/width/height/radius.
# - Show/hide: static with hidden:, runtime via on_load/on_state automations.
# - Text/value content: label text defaults here; live values usually update from button/template automations.
# - Runtime/interval hooks: page on_load here; shared timers/nav/time in pages/page_shell_480-sensecap.yaml.
# - Entity/attribute wiring: common/core_ha_common-sensecap.yaml and common/*ha*-sensecap*.yaml.
# - Keep page files focused on ui_* + layout; use per-page overrides only when needed.
# =============================================================================
substitutions:
  page0_id: "page_home_v2"
  sense_page_tstat_id: "page_thermostat_v2"
  sense_page_fans_id: "page_fans"
  sense_page_overrides_id: "page_overrides"
  page0_title_text: "Home Menu"
  page0_title_font: "${ui_page_title_font}"
  page0_title_y: "${ui_page_title_y_offset}"


lvgl:
  pages:
    - id: ${page0_id}
      styles: page_style
      layout:
        type: grid
        grid_rows:
          - 34
          - FR(1)
          - FR(1)
          - FR(1)
        grid_columns:
          - FR(1)
          - FR(1)
          - FR(1)
        pad_row: 10
        pad_column: 10
      pad_top: ${sense_content_y | default("46")}
      pad_bottom: 76
      pad_left: 8
      pad_right: 8
      widgets:
        - label:
            id: page0_title
            text: ${page0_title_text}
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_column_span: 3
            grid_cell_x_align: center
            grid_cell_y_align: center
            y: ${page0_title_y}
            text_font: ${page0_title_font}
            styles: sense_text_title_style
        - button:
            id: page0_slot0_tile
            grid_cell_row_pos: 1
            grid_cell_column_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_color: ${ui_page0_slot0_off_bg}
            radius: 8
            pad_left: 8
            pad_right: 8
            pad_top: 4
            pad_bottom: 4
            on_press:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${ui_page0_slot0_entity_id}
            widgets:
              - label:
                  id: page0_slot0_icon
                  text: ${ui_page0_slot0_icon}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: ${ui_page0_slot0_icon_off_color}
              - label:
                  id: page0_slot0_label
                  text: ${ui_page0_slot0_text}
                  align: BOTTOM_LEFT
                  text_font: nunito_20
                  text_color: ${ui_page0_slot0_text_off_color}
              - label:
                  id: page0_slot0_value
                  text: ${ui_page0_slot0_value_off}
                  align: BOTTOM_RIGHT
                  text_font: nunito_18
                  text_color: ${ui_page0_slot0_value_off_color}
                  hidden: false
        - button:
            id: page0_slot1_tile
            grid_cell_row_pos: 1
