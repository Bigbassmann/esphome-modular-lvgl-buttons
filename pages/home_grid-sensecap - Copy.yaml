binary_sensor:
  - id: widget_sensor_page0_slot0_state
    platform: homeassistant
    entity_id: ${ui_page0_slot0_entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_page0_slot0_state
          then:
            - lvgl.widget.update:
                id: page0_slot0_tile
                bg_color: ${ui_page0_slot0_on_bg}
            - if:
                condition:
                  lambda: 'return std::string("${ui_page0_slot0_on_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: page0_slot0_icon
                      text: ${ui_page0_slot0_on_icon}
            - lvgl.widget.update:
                id: page0_slot0_icon
                text_color: ${ui_page0_slot0_icon_on_color}
            - lvgl.widget.update:
                id: page0_slot0_label
                text_color: ${ui_page0_slot0_text_on_color}
            - lvgl.label.update:
                id: page0_slot0_value
                text: ${ui_page0_slot0_value_on}
            - lvgl.widget.update:
                id: page0_slot0_value
                text_color: ${ui_page0_slot0_value_on_color}
            - if:
                condition:
                  lambda: 'return std::string("${ui_page0_slot0_show_icon | default("true")}") == "true";'
