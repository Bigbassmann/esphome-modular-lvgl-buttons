binary_sensor:
  - id: widget_sensor_overrides_btn_cleaners
    platform: homeassistant
    entity_id: ${ui_overrides_cleaners_entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_overrides_btn_cleaners
          then:
            - lvgl.widget.update:
                id: button_overrides_btn_cleaners
                bg_color: ${ui_overrides_cleaners_on_bg}
            - if:
                condition:
                  lambda: 'return std::string("${ui_overrides_cleaners_on_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: icon_overrides_btn_cleaners
                      text: ${ui_overrides_cleaners_on_icon}
            - lvgl.widget.update:
                id: icon_overrides_btn_cleaners
                text_color: ${ui_overrides_cleaners_icon_on_color}
            - lvgl.widget.update:
                id: label_overrides_btn_cleaners
                text_color: ${ui_overrides_cleaners_text_on_color}
            - lvgl.label.update:
                id: value_overrides_btn_cleaners
                text: ${ui_overrides_cleaners_value_on}
            - lvgl.widget.update:
                id: value_overrides_btn_cleaners
                text_color: ${ui_overrides_cleaners_value_on_color}
            - if:
                condition:
                  lambda: 'return std::string("${ui_overrides_cleaners_show_icon | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: icon_overrides_btn_cleaners
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: icon_overrides_btn_cleaners
                      hidden: true
            - if:
                condition:
                  lambda: 'return std::string("${ui_overrides_cleaners_show_text | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: label_overrides_btn_cleaners
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: label_overrides_btn_cleaners
                      hidden: true
            - if:
                condition:
                  lambda: 'return std::string("${ui_overrides_cleaners_show_value | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: value_overrides_btn_cleaners
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: value_overrides_btn_cleaners
                      hidden: true
          else:
            - lvgl.widget.update:
                id: button_overrides_btn_cleaners
                bg_color: ${ui_overrides_cleaners_off_bg}
            - if:
                condition:
                  lambda: 'return std::string("${ui_overrides_cleaners_off_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: icon_overrides_btn_cleaners
                      text: ${ui_overrides_cleaners_off_icon}
            - lvgl.widget.update:
                id: icon_overrides_btn_cleaners
                text_color: ${ui_overrides_cleaners_icon_off_color}
            - lvgl.widget.update:
                id: label_overrides_btn_cleaners
                text_color: ${ui_overrides_cleaners_text_off_color}
            - lvgl.label.update:
                id: value_overrides_btn_cleaners
                text: ${ui_overrides_cleaners_value_off}
            - lvgl.widget.update:
                id: value_overrides_btn_cleaners
                text_color: ${ui_overrides_cleaners_value_off_color}
            - if:
                condition:
                  lambda: 'return std::string("${ui_overrides_cleaners_show_icon | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: icon_overrides_btn_cleaners
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: icon_overrides_btn_cleaners
                      hidden: true
            - if:
                condition:
                  lambda: 'return std::string("${ui_overrides_cleaners_show_text | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: label_overrides_btn_cleaners
