substitutions:
  sense_page_overrides_id: "page_overrides"

  ui_overrides_dani_entity_id: "${ent_dani_mode_on}"
  ui_overrides_dani_text: "${ui_dani_text}"
  ui_overrides_dani_icon: "${ui_dani_icon}"
  ui_overrides_dani_on_bg: "${ui_dani_on_bg}"
  ui_overrides_dani_off_bg: "${ui_dani_off_bg}"
  ui_overrides_dani_on_icon: "${ui_dani_on_icon}"
  ui_overrides_dani_off_icon: "${ui_dani_off_icon}"
  ui_overrides_dani_value_on: "${ui_dani_value_on}"
  ui_overrides_dani_value_off: "${ui_dani_value_off}"
  ui_overrides_dani_icon_on_color: "$icon_on_color"
  ui_overrides_dani_icon_off_color: "sense_text_muted"
  ui_overrides_dani_text_on_color: "white"
  ui_overrides_dani_text_off_color: "white"
  ui_overrides_dani_value_on_color: "white"
  ui_overrides_dani_value_off_color: "white"
  ui_overrides_dani_show_icon: "true"
  ui_overrides_dani_show_text: "true"
  ui_overrides_dani_show_value: "true"

lvgl:
  pages:
    - id: ${sense_page_overrides_id}
      styles: sense_page_style
      layout:
        type: grid
        grid_rows:
          - 40
          - FR(1)
          - FR(1)
          - FR(1)
          - FR(1)
        grid_columns:
          - FR(1)
          - FR(1)
        pad_row: 6
        pad_column: 8
        multiple_widgets_per_cell: true
      pad_top: ${sense_content_y | default("44")}
      pad_bottom: 76
      pad_left: 8
      pad_right: 8
      widgets:
        - obj:
            id: overrides_card_bg
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_row_span: 5
            grid_cell_column_span: 2
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            styles: sense_card_flat_style
            clickable: false
        - label:
            id: overrides_page_title
            text: "Overrides"
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_column_span: 2
            grid_cell_x_align: center
            grid_cell_y_align: center
            y: -2
            text_font: nunito_36
            text_color: sense_info
        - container:
            id: overrides_btn_cleaners
            grid_cell_row_pos: 1
            grid_cell_column_pos: 0
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_overrides_btn_cleaners
                  width: 100%
                  height: 100%
                  radius: 8
                  pad_left: 8
                  pad_right: 8
                  pad_top: 4
                  pad_bottom: 4
                  layout:
                    type: grid
                    grid_rows: [fr(1)]
                    grid_columns: [content, fr(1), content]
                  widgets:
                    - label:
                        id: icon_overrides_btn_cleaners
                        text_font: $icon_font
                        text: ${ui_overrides_cleaners_icon}
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 0
                        grid_cell_x_align: start
                        grid_cell_y_align: center
                    - label:
                        id: label_overrides_btn_cleaners
                        text_font: nunito_20
                        text: ${ui_overrides_cleaners_text}
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 1
                        grid_cell_x_align: start
                        grid_cell_y_align: center
                    - label:
                        id: value_overrides_btn_cleaners
                        text_font: nunito_18
                        text: ${ui_overrides_cleaners_value_off}
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 2
                        grid_cell_x_align: end
                        grid_cell_y_align: center
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: ${ui_overrides_cleaners_entity_id}
        - container:
            id: overrides_btn_dani
