                  lambda: 'return std::string("${ui_overrides_cleaners_show_value | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: value_overrides_btn_cleaners
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: value_overrides_btn_cleaners
                      hidden: true
