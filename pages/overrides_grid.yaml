substitutions:
  sense_page_overrides_id: "page_overrides"

lvgl:
  pages:
    - id: ${sense_page_overrides_id}
      styles: sense_page_style
      layout: 4x2
      layout:
        type: grid
        grid_rows:
          - 40
          - FR(1)
          - FR(1)
          - FR(1)
          - FR(1)
        grid_columns:
          - FR(1)
          - FR(1)
        pad_row: 8
        pad_column: 8
        multiple_widgets_per_cell: true
      pad_top: ${sense_content_y | default("46")}
        pad_row: 6
        pad_column: 8
        multiple_widgets_per_cell: true
      pad_top: ${sense_content_y | default("44")}
      pad_bottom: 76
      pad_left: 8
      pad_right: 8
      widgets:
        - obj:
            id: overrides_card_bg
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_row_span: 5
            grid_cell_column_span: 2
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            styles: sense_card_style
            clickable: false
        - label:
            id: overrides_page_title
            text: "Overrides"
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_column_span: 2
            grid_cell_x_align: center
            grid_cell_y_align: center
            text_font: nunito_36
            text_color: sense_info
