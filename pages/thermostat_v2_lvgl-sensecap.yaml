substitutions:
  tstat_title_font: "montserrat_24"
  tstat_title_color: "sense_info"
  tstat_text_color: sense_text
  tstat_text_muted_color: sense_text_muted
  tstat_accent_color: sense_info
  tstat_mode_inactive_color: "dani_tstat_mode_inactive"
  tstat_mode_off_active_color: "dani_tstat_mode_off_active"
  tstat_mode_heat_active_color: "dani_tstat_mode_heat_active"
  tstat_mode_cool_active_color: "dani_tstat_mode_cool_active"

globals:
  - id: tstat_page_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: tstat_runtime_syncing
    type: bool
    restore_value: false
    initial_value: "false"

lvgl:
  pages:
    - id: page_thermostat_v2
      styles: sense_page_style
      on_load:
        - lambda: 'id(tstat_page_active) = true;'
        - component.update: ha_tstat_current_temp
        - component.update: ha_tstat_target_temp
      on_unload:
        - lambda: 'id(tstat_page_active) = false;'
      widgets:
        - obj:
            id: tstat2_card
            align: TOP_MID
            y: ${sense_content_y | default("46")}
            width: 100%
            height: ${sense_content_h | default("366")}
            styles: sense_card_flat_style

            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  text: "Thermostat"
                  align: TOP_MID
                  y: 8
                  text_font: ${tstat_title_font}
                  text_color: ${tstat_title_color}

              - label:
                  text: "HVAC Status"
                  align: TOP_LEFT
                  x: 20
                  y: 96
                  text_font: montserrat_14
                  text_color: ${tstat_text_muted_color}

              - label:
                  text: "Fan Status"
                  align: TOP_RIGHT
                  x: -20
                  y: 96
                  text_font: montserrat_14
                  text_color: ${tstat_text_muted_color}

              - label:
                  id: tstat2_hvac_action_label
                  text: "--"
                  align: TOP_LEFT
                  x: 20
                  y: 114
                  text_font: montserrat_16
                  text_color: ${tstat_text_color}

              - label:
                  id: tstat2_fan_state_label
                  text: "--"
                  align: TOP_RIGHT
                  x: -20
                  y: 114
                  text_font: montserrat_16
                  text_color: ${tstat_text_color}


              - arc:
                  id: tstat2_target_arc
                  align: TOP_MID
                  x: 0
                  y: 104
                  width: 332
                  height: 248
                  min_value: 50
                  max_value: 85
                  value: 68
                  adjustable: true
                  start_angle: 135
                  end_angle: 45
                  arc_rounded: true
                  indicator:
                    arc_color: ${tstat_mode_off_active_color}
                    arc_width: 24
                  knob:
                    bg_color: ${tstat_accent_color}
                    pad_all: 3
                  on_value:
                    then:
                      - lvgl.label.update:
                          id: tstat2_target_value
                          text: !lambda |-
                            char buf[24];
                            int v = lv_arc_get_value(id(tstat2_target_arc));
                            if (v < 50) v = 50;
                            if (v > 85) v = 85;
                            snprintf(buf, sizeof(buf), "%.1f F", (float) v);
                            return std::string(buf);
                  on_release:
                    then:
                      - homeassistant.service:
                          service: climate.set_temperature
                          data:
                            entity_id: ${ent_thermostat}
                          data_template:
                            temperature: !lambda |-
                              char buf[16];
                              int v = lv_arc_get_value(id(tstat2_target_arc));
                              if (v < 50) v = 50;
                              if (v > 85) v = 85;
                              snprintf(buf, sizeof(buf), "%d", v);
                              return std::string(buf);

              - label:
                  text: "Current"
                  align: TOP_MID
                  x: 0
                  y: 170
                  text_font: montserrat_14
                  text_color: ${tstat_text_muted_color}

              - label:
                  id: tstat2_current_value
                  text: "--"
                  align: TOP_MID
                  x: 0
                  y: 188
                  text_font: montserrat_20
                  text_color: ${tstat_text_color}

              - label:
                  text: "Target"
                  align: TOP_MID
                  x: 0
                  y: 214
                  text_font: montserrat_14
                  text_color: ${tstat_text_muted_color}

              - label:
                  id: tstat2_target_value
                  text: "--"
                  align: TOP_MID
                  x: 0
                  y: 232
                  text_font: montserrat_20
                  text_color: ${tstat_accent_color}

              - label:
                  text: "Humidity"
                  align: TOP_MID
                  x: 0
                  y: 258
                  text_font: montserrat_14
                  text_color: ${tstat_text_muted_color}

              - label:
                  id: tstat2_humidity_value
                  text: "--"
                  align: TOP_MID
                  x: 0
                  y: 276
                  text_font: montserrat_16
                  text_color: ${tstat_text_muted_color}

              - label:
                  text: "HVAC Mode"
                  align: TOP_LEFT
                  x: 24    # 28
                  y: 42
                  text_font: montserrat_14
                  text_color: ${tstat_accent_color}

              - dropdown:
                  id: tstat2_mode_dropdown
                  align: TOP_LEFT
                  x: 24    #28 
                  y: 60
                  width: 138
                  height: 30  # 32
                  text_font: montserrat_14
                  options:
                    - "Off"
                    - "Heat"
                    - "Cool"
                  selected_index: 0
                  on_value:
                    then:
                      - if:
                          condition:
                            lambda: 'return x == 0;'
                          then:
                            - logger.log: "tstat_ui hvac -> off"
                            - homeassistant.service:
                                service: climate.set_hvac_mode
                                data:
                                  entity_id: ${ent_thermostat}
                                  hvac_mode: "off"
                      - if:
                          condition:
                            lambda: 'return x == 1;'
                          then:
                            - logger.log: "tstat_ui hvac -> heat"
                            - homeassistant.service:
                                service: climate.set_hvac_mode
                                data:
                                  entity_id: ${ent_thermostat}
                                  hvac_mode: "heat"
                      - if:
                          condition:
                            lambda: 'return x == 2;'
                          then:
                            - logger.log: "tstat_ui hvac -> cool"
                            - homeassistant.service:
                                service: climate.set_hvac_mode
                                data:
                                  entity_id: ${ent_thermostat}
                                  hvac_mode: "cool"

              - label:
                  text: "Fan Mode"
                  align: TOP_RIGHT
                  x: -24    # -28
                  y: 42
                  text_font: montserrat_14
                  text_color: ${tstat_accent_color}

              - dropdown:
                  id: tstat2_fan_dropdown
                  align: TOP_RIGHT
                  x: -24    # -28
                  y: 60
                  width: 138
                  height: 30  # 32
                  text_font: montserrat_14
                  options:
                    - "Auto low"
                    - "Low"
                    - "Circulation"
                  selected_index: 0
                  on_value:
                    then:
                      - if:
                          condition:
                            lambda: 'return x == 0;'
                          then:
                            - logger.log: "tstat_ui fan -> Auto low"
                            - homeassistant.service:
                                service: climate.set_fan_mode
                                data:
                                  entity_id: ${ent_thermostat}
                                  fan_mode: "Auto low"
                      - if:
                          condition:
                            lambda: 'return x == 1;'
                          then:
                            - logger.log: "tstat_ui fan -> Low"
                            - homeassistant.service:
                                service: climate.set_fan_mode
                                data:
                                  entity_id: ${ent_thermostat}
                                  fan_mode: "Low"
                      - if:
                          condition:
                            lambda: 'return x == 2;'
                          then:
                            - logger.log: "tstat_ui fan -> Circulation"
                            - homeassistant.service:
                                service: climate.set_fan_mode
                                data:
                                  entity_id: ${ent_thermostat}
                                  fan_mode: "Circulation"

script:
  - id: cap_tstat_set_mode_off
    then:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: ${ent_thermostat}
            hvac_mode: "off"

  - id: cap_tstat_set_mode_heat
    then:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: ${ent_thermostat}
            hvac_mode: "heat"

  - id: cap_tstat_set_mode_cool
    then:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: ${ent_thermostat}
            hvac_mode: "cool"

text_sensor:
  - platform: homeassistant
    id: cap_tstat_mode
    entity_id: ${ent_thermostat}
    attribute: ${attr_hvac_mode}
    internal: true
  - platform: homeassistant
    id: cap_tstat_hvac_action
    entity_id: ${ent_thermostat}
    attribute: ${attr_hvac_action}
    internal: true
  - platform: homeassistant
    id: cap_tstat_fan_mode
    entity_id: ${ent_thermostat}
    attribute: ${attr_fan_mode}
    internal: true
  - platform: homeassistant
    id: cap_tstat_fan_state
    entity_id: ${ent_thermostat}
    attribute: ${attr_fan_state}
    internal: true

sensor:
  - platform: template
    id: cap_tstat_current_temp
    internal: true
    update_interval: never
    lambda: |-
      return id(ha_tstat_current_temp).state;
  - platform: template
    id: cap_tstat_target_temp
    internal: true
    update_interval: never
    lambda: |-
      return id(ha_tstat_target_temp).state;

# globals:
#  - id: last_interaction_ms
#    type: uint32_t
#    restore_value: false
#    initial_value: "0"

interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(tstat_page_active);'
          then:
            - component.update: ha_tstat_current_temp
            - component.update: ha_tstat_target_temp
            - lambda: |-
                static float prev_target = NAN;
                static float prev_current = NAN;
                static std::string prev_mode;
                static std::string prev_action;
                static std::string prev_fan_mode;
                static std::string prev_fan_state;
                float target = id(ha_tstat_target_temp).state;
                float current = id(ha_tstat_current_temp).state;
                std::string mode = id(ha_tstat_mode).state;
                std::string action = id(ha_tstat_hvac_action).state;
                std::string fan_mode = id(ha_tstat_fan_mode).state;
                std::string fan_state = id(ha_tstat_fan_state).state;
                bool changed = false;
                if ((isnan(prev_target) != isnan(target)) || (!isnan(target) && fabsf(prev_target - target) > 0.01f)) changed = true;
                if ((isnan(prev_current) != isnan(current)) || (!isnan(current) && fabsf(prev_current - current) > 0.01f)) changed = true;
                if (mode != prev_mode || action != prev_action || fan_mode != prev_fan_mode || fan_state != prev_fan_state) changed = true;
                if (changed) {
                  if (!isnan(current) && !isnan(target)) {
                    ESP_LOGI("tstat_sync", "HA sync mode=%s action=%s fan_mode=%s fan_state=%s current=%.1f target=%.1f", mode.c_str(), action.c_str(), fan_mode.c_str(), fan_state.c_str(), current, target);
                  } else {
                    ESP_LOGI("tstat_sync", "HA sync mode=%s action=%s fan_mode=%s fan_state=%s (temp unavailable)",
                             mode.c_str(), action.c_str(), fan_mode.c_str(), fan_state.c_str());
                  }
                  prev_target = target;
                  prev_current = current;
                  prev_mode = mode;
                  prev_action = action;
                  prev_fan_mode = fan_mode;
                  prev_fan_state = fan_state;
                }

            - lambda: 'id(tstat_runtime_syncing) = true;'

            - lvgl.label.update:
                id: tstat2_hvac_action_label
                text: !lambda |-
                  std::string s = id(ha_tstat_hvac_action).state.empty() ? id(ha_tstat_mode).state : id(ha_tstat_hvac_action).state;
                  if (s.empty()) return std::string("--");
                  for (auto &ch : s) ch = tolower(ch);
                  if (s == "off") return std::string("Off");
                  if (s == "idle") return std::string("Idle");
                  if (s == "heating") return std::string("Heating");
                  if (s == "cooling") return std::string("Cooling");
                  if (s == "heat") return std::string("Heat");
                  if (s == "cool") return std::string("Cool");
                  if (s == "auto" || s == "heat_cool") return std::string("Auto");
                  if (!s.empty()) s[0] = toupper(s[0]);
                  return s;

            - lvgl.label.update:
                id: tstat2_fan_state_label
                text: !lambda |-
                  if (id(ha_tstat_fan_state).state.empty()) return std::string("--");
                  return id(ha_tstat_fan_state).state;

            - lvgl.label.update:
                id: tstat2_current_value
                text: !lambda |-
                  if (isnan(id(ha_tstat_current_temp).state)) return std::string("--");
                  char buf[24];
                  snprintf(buf, sizeof(buf), "%.1f F", id(ha_tstat_current_temp).state);
                  return std::string(buf);

            - lvgl.label.update:
                id: tstat2_target_value
                text: !lambda |-
                  if (isnan(id(ha_tstat_target_temp).state)) return std::string("--");
                  char buf[24];
                  snprintf(buf, sizeof(buf), "%.1f F", id(ha_tstat_target_temp).state);
                  return std::string(buf);

            - lvgl.label.update:
                id: tstat2_humidity_value
                text: !lambda |-
                  if (isnan(id(humid).state)) return std::string("--");
                  char buf[24];
                  snprintf(buf, sizeof(buf), "%.0f%%", id(humid).state);
                  return std::string(buf);

            - lvgl.arc.update:
                id: tstat2_target_arc
                value: !lambda |-
                  if (isnan(id(ha_tstat_target_temp).state)) return 68;
                  int t = (int) roundf(id(ha_tstat_target_temp).state);
                  if (t < 50) t = 50;
                  if (t > 85) t = 85;
                  return t;

            - if:
                condition:
                  lambda: 'return id(ha_tstat_hvac_action).state == "cooling" || id(ha_tstat_mode).state == "cool";'
                then:
                  - lvgl.widget.update:
                      id: tstat2_target_arc
                      indicator:
                        arc_color: ${tstat_mode_cool_active_color}

            - if:
                condition:
                  lambda: 'return id(ha_tstat_hvac_action).state == "heating" || id(ha_tstat_mode).state == "heat";'
                then:
                  - lvgl.widget.update:
                      id: tstat2_target_arc
                      indicator:
                        arc_color: ${tstat_mode_heat_active_color}

            - if:
                condition:
                  lambda: 'return id(ha_tstat_mode).state == "off" || id(ha_tstat_hvac_action).state == "off" || id(ha_tstat_hvac_action).state.empty();'
                then:
                  - lvgl.widget.update:
                      id: tstat2_target_arc
                      indicator:
                        arc_color: ${tstat_mode_off_active_color}



            - lvgl.dropdown.update:
                id: tstat2_mode_dropdown
                selected_index: !lambda |-
                  if (id(ha_tstat_mode).state == "heat") return 1;
                  if (id(ha_tstat_mode).state == "cool") return 2;
                  return 0;

            - lvgl.dropdown.update:
                id: tstat2_fan_dropdown
                selected_index: !lambda |-
                  std::string fm = id(ha_tstat_fan_mode).state;
                  for (auto &ch : fm) ch = tolower(ch);
                  if (fm == "auto low" || fm == "auto_low") return 0;
                  if (fm == "low") return 1;
                  if (fm == "circulation" || fm == "circulate") return 2;
                  return 0;

            - lambda: 'id(tstat_runtime_syncing) = false;'


