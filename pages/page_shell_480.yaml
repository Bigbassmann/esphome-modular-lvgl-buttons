substitutions:
  sense_page_home_id: "main_page"
  sense_page_menu_id: "page_menu"
  sense_page_wifi_id: "page_wifi_setup"
  sense_page_settings_id: "page_settings"
  sense_page_tstat_id: "main_page"
  sense_page_fans_id: "main_page"
  sense_page_overrides_id: "main_page"
  sense_page_lighting_dimmers_id: "main_page"
  sense_page_lighting_switches_id: "main_page"

globals:
  - id: sense_nav_index
    type: int
    restore_value: false
    initial_value: "0"

time:
  - platform: homeassistant
    id: sense_topbar_time_src

sensor:
  - platform: wifi_signal
    id: sense_topbar_wifi_db
    internal: true
    update_interval: 30s

script:
  - id: nav_to_home
    then:
      - lambda: 'id(sense_nav_index) = 0;'
      - lvgl.page.show: ${sense_page_home_id}

  - id: nav_to_menu
    then:
      - lambda: 'id(sense_nav_index) = 1;'
      - lvgl.page.show: ${sense_page_menu_id}

  - id: nav_to_wifi
    then:
      - lambda: 'id(sense_nav_index) = 2;'
      - lvgl.page.show: ${sense_page_wifi_id}

  - id: nav_to_settings
    then:
      - lambda: 'id(sense_nav_index) = 3;'
      - lvgl.page.show: ${sense_page_settings_id}

  - id: nav_to_tstat
    then:
      - lambda: 'id(sense_nav_index) = 4;'
      - lvgl.page.show: ${sense_page_tstat_id}

  - id: nav_to_prev
    then:
      - lambda: |-
          id(sense_nav_index) = (id(sense_nav_index) + 4) % 5;
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 0;'
          then:
            - script.execute: nav_to_home
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 1;'
          then:
            - script.execute: nav_to_menu
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 2;'
          then:
            - script.execute: nav_to_wifi
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 3;'
          then:
            - script.execute: nav_to_settings
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 4;'
          then:
            - script.execute: nav_to_tstat

  - id: nav_to_next
    then:
      - lambda: |-
          id(sense_nav_index) = (id(sense_nav_index) + 1) % 5;
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 0;'
          then:
            - script.execute: nav_to_home
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 1;'
          then:
            - script.execute: nav_to_menu
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 2;'
          then:
            - script.execute: nav_to_wifi
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 3;'
          then:
            - script.execute: nav_to_settings
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 4;'
          then:
            - script.execute: nav_to_tstat

interval:
  - interval: 30s
    then:
      - lvgl.label.update:
          id: sense_topbar_date
          text: !lambda |-
            auto now = id(sense_topbar_time_src).now();
            if (!now.is_valid()) return std::string("Date --");
            return now.strftime("%a %b %d");
      - lvgl.label.update:
          id: sense_topbar_time
          text: !lambda |-
            auto now = id(sense_topbar_time_src).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%l:%M %P");
      - lvgl.label.update:
          id: sense_topbar_wifi
          text: !lambda |-
            if (isnan(id(sense_topbar_wifi_db).state)) return std::string("WiFi --");
            char buf[24];
            snprintf(buf, sizeof(buf), "%.0f", id(sense_topbar_wifi_db).state);
            return std::string(buf);

lvgl:
  top_layer:
    widgets:
      - !include
        file: ../widgets/topbar_sensecap.yaml
      - !include
        file: ../widgets/bottom_nav_sensecap.yaml
