substitutions:
  sense_page_home_id: "page_home_v2"
  sense_page_tstat_id: "page_thermostat_v2"
  sense_page_fans_id: "page_fans"
  sense_page_overrides_id: "page_overrides"


lvgl:
  pages:
    - id: ${sense_page_home_id}
      styles: sense_page_style
      layout:
        type: grid
        grid_rows:
          - FR(1)
          - FR(1)
          - FR(1)
        grid_columns:
          - FR(1)
          - FR(1)
          - FR(1)
        pad_row: 10
        pad_column: 10
      pad_top: ${sense_content_y | default("46")}
      pad_bottom: 76
      pad_left: 8
      pad_right: 8
      widgets:
        - button:
            id: home_v2_btn_dani  # Should be home_page_3x3_layout_row_0_col_0_btn, but keeping old ID for now to avoid breaking existing overrides
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_color: ${ui_home_dani_off_bg}
            radius: 8
            pad_left: 8
            pad_right: 8
            pad_top: 4
            pad_bottom: 4
            on_press:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${ui_home_dani_entity_id}
            widgets:
              - label:
                  id: home_v2_icon_dani
                  text: ${ui_home_dani_icon}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: ${ui_home_dani_icon_off_color}
              - label:
                  id: home_v2_label_dani
                  text: ${ui_home_dani_text}
                  align: BOTTOM_LEFT
                  text_font: nunito_20
                  text_color: ${ui_home_dani_text_off_color}
              - label:
                  id: home_v2_value_dani
                  text: ${ui_home_dani_value_off}
                  align: BOTTOM_RIGHT
                  text_font: nunito_18
                  text_color: white
                  hidden: false
        - button:
            id: home_v2_btn_sleepy
            grid_cell_row_pos: 0
            grid_cell_column_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_color: ${ui_home_sleepy_off_bg}
            radius: 8
            pad_left: 8
            pad_right: 8
            pad_top: 4
            pad_bottom: 4
            on_press:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${ui_home_sleepy_entity_id}
            widgets:
              - label:
                  id: home_v2_icon_sleepy
                  text: ${ui_home_sleepy_icon}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: ${ui_home_sleepy_icon_off_color}
              - label:
                  id: home_v2_label_sleepy
                  text: ${ui_home_sleepy_text}
                  align: BOTTOM_LEFT
                  text_font: nunito_20
                  text_color: ${ui_home_sleepy_text_off_color}
              - label:
                  id: home_v2_value_sleepy
                  text: ${ui_home_sleepy_value_off}
                  align: BOTTOM_RIGHT
                  text_font: nunito_18
                  text_color: ${ui_home_sleepy_value_off_color}
                  hidden: true
        - button:
            id: home_v2_btn_bedtime
            grid_cell_row_pos: 0
            grid_cell_column_pos: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_color: ${ui_home_bedtime_off_bg}
            radius: 8
            pad_left: 8
            pad_right: 8
            pad_top: 4
            pad_bottom: 4
            on_press:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${ui_home_bedtime_entity_id}
            widgets:
              - label:
                  id: home_v2_icon_bedtime
                  text: ${ui_home_bedtime_icon}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: ${ui_home_bedtime_icon_off_color}
              - label:
                  id: home_v2_label_bedtime
                  text: ${ui_home_bedtime_text}
                  align: BOTTOM_LEFT
                  text_font: nunito_20
                  text_color: ${ui_home_bedtime_text_off_color}
              - label:
                  id: home_v2_value_bedtime
                  text: ${ui_home_bedtime_value_off}
                  align: BOTTOM_RIGHT
                  text_font: nunito_18
                  text_color: ${ui_home_bedtime_value_off_color}
                  hidden: true
        - button:
            id: home_v2_btn_tstat
            grid_cell_row_pos: 1
            grid_cell_column_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            styles: sense_tile_tstat_style
            on_press:
              - script.execute: nav_to_tstat
            widgets:
              - label:
                  text: ${mdi_thermometer}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: sense_bg
              - label:
                  text: "Thermostat"
                  align: BOTTOM_LEFT
                  text_font: nunito_20
                  text_color: sense_bg

        - button:
            id: home_v2_btn_fans
            grid_cell_row_pos: 1
            grid_cell_column_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            styles: sense_tile_fans_style
            on_press:
              - script.execute: nav_to_fans
            widgets:
              - label:
                  text: ${mdi_fan}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: ${ui_home_dani_text_off_color}
              - label:
                  text: "Fans"
                  align: BOTTOM_LEFT
                  text_font: nunito_20
                  text_color: ${ui_home_dani_text_off_color}

        - button:
            id: home_v2_btn_overrides
            grid_cell_row_pos: 1
            grid_cell_column_pos: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            styles: sense_tile_overrides_style
            on_press:
              - script.execute: nav_to_overrides
            widgets:
              - label:
                  text: ${mdi_tune}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: sense_bg
              - label:
                  text: "Overrides"
                  align: BOTTOM_LEFT
                  text_font: nunito_20
                  text_color: sense_bg

        - button:
            id: home_v2_btn_placeholder_1
            grid_cell_row_pos: 2
            grid_cell_column_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            styles: sense_tile_placeholder_style
            widgets:
              - label:
                  text: ${mdi_dots_horizontal}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: sense_tile_placeholder_text
              - label:
                  text: "Placeholder 1"
                  align: BOTTOM_LEFT
                  text_font: nunito_18
                  text_color: sense_tile_placeholder_text

        - button:
            id: home_v2_btn_placeholder_2
            grid_cell_row_pos: 2
            grid_cell_column_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            styles: sense_tile_placeholder_style
            widgets:
              - label:
                  text: ${mdi_dots_horizontal}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: sense_tile_placeholder_text
              - label:
                  text: "Placeholder 2"
                  align: BOTTOM_LEFT
                  text_font: nunito_18
                  text_color: sense_tile_placeholder_text

        - button:
            id: home_v2_btn_placeholder_3
            grid_cell_row_pos: 2
            grid_cell_column_pos: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            styles: sense_tile_placeholder_style
            widgets:
              - label:
                  text: ${mdi_dots_horizontal}
                  align: TOP_LEFT
                  text_font: mdi_icons_40
                  text_color: sense_tile_placeholder_text
              - label:
                  text: "Placeholder 3"
                  align: BOTTOM_LEFT
                  text_font: nunito_18
                  text_color: sense_tile_placeholder_text


binary_sensor:
  - id: widget_sensor_home_v2_btn_dani
    platform: homeassistant
    entity_id: ${ui_home_dani_entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_home_v2_btn_dani
          then:
            - lvgl.widget.update:
                id: home_v2_btn_dani
                bg_color: ${ui_home_dani_on_bg}
            - if:
                condition:
                  lambda: 'return std::string("${ui_home_dani_on_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: home_v2_icon_dani
                      text: ${ui_home_dani_on_icon}
            - lvgl.widget.update:
                id: home_v2_icon_dani
                text_color: ${ui_home_dani_icon_on_color}
            - lvgl.widget.update:
                id: home_v2_label_dani
                text_color: ${ui_home_dani_text_on_color}
            - lvgl.label.update:
                id: home_v2_value_dani
                text: ${ui_home_dani_value_on}
            - lvgl.widget.update:
                id: home_v2_value_dani
                text_color: ${ui_home_dani_value_on_color}
            - if:
                condition:
                  lambda: 'return std::string("${ui_home_dani_show_icon | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: home_v2_icon_dani
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: home_v2_icon_dani
                      hidden: true
            - if:
                condition:
                  lambda: 'return std::string("${ui_home_dani_show_text | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: home_v2_label_dani
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: home_v2_label_dani
                      hidden: true
            - if:
                condition:
                  lambda: 'return std::string("${ui_home_dani_show_value | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: home_v2_value_dani
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: home_v2_value_dani
                      hidden: true
          else:
            - lvgl.widget.update:
                id: home_v2_btn_dani
                bg_color: ${ui_home_dani_off_bg}
            - if:
                condition:
                  lambda: 'return std::string("${ui_home_dani_off_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: home_v2_icon_dani
                      text: ${ui_home_dani_off_icon}
            - lvgl.widget.update:
                id: home_v2_icon_dani
                text_color: ${ui_home_dani_icon_off_color}
            - lvgl.widget.update:
                id: home_v2_label_dani
                text_color: ${ui_home_dani_text_off_color}
            - lvgl.label.update:
                id: home_v2_value_dani
                text: ${ui_home_dani_value_off}
            - lvgl.widget.update:
                id: home_v2_value_dani
                text_color: ${ui_home_dani_value_off_color}
            - if:
                condition:
                  lambda: 'return std::string("${ui_home_dani_show_icon | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: home_v2_icon_dani
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: home_v2_icon_dani
                      hidden: true
            - if:
                condition:
                  lambda: 'return std::string("${ui_home_dani_show_text | default("true")}") == "true";'
                then:
                  - lvgl.widget.update:
                      id: home_v2_label_dani
