substitutions:
  sense_page_home_id: "main_page"
  sense_page_menu_id: "page_menu"
  sense_page_wifi_id: "page_wifi_setup"
  sense_page_settings_id: "page_settings"
  sense_page_tstat_id: "page_thermostat_v2"
  sense_page_fans_id: "page_fans"
  sense_page_overrides_id: "page_overrides"
  sense_page_lighting_dimmers_id: "page_lighting_dimmers"
  sense_page_lighting_dimmers_2_id: "page_lighting_dimmers_2"
  sense_page_lighting_switches_id: "page_lighting_switches"
  sense_page_sensors_id: "page_sensors"
  sense_page_info_id: "info_screen"
  sense_page_display_settings_id: "page_display_settings"

globals:
  - id: sense_nav_index
    type: int
    restore_value: false
    initial_value: "0"

time:
  - platform: homeassistant
    id: sense_topbar_time_src

sensor:
  - platform: wifi_signal
    id: sense_topbar_wifi_db
    internal: true
    update_interval: 30s

script:
  - id: nav_to_home
    then:
      - lambda: 'id(sense_nav_index) = 0;'
      - lvgl.page.show: ${sense_page_home_id}

  - id: nav_to_menu
    then:
      - lvgl.page.show: ${sense_page_menu_id}

  - id: nav_to_wifi
    then:
      - lvgl.page.show: ${sense_page_wifi_id}

  - id: nav_to_settings
    then:
      - lvgl.page.show: ${sense_page_settings_id}

  - id: nav_to_display_settings
    then:
      - lvgl.page.show: ${sense_page_display_settings_id}

  - id: nav_to_tstat
    then:
      - lambda: 'id(sense_nav_index) = 1;'
      - lvgl.page.show: ${sense_page_tstat_id}

  - id: nav_to_fans
    then:
      - lambda: 'id(sense_nav_index) = 2;'
      - lvgl.page.show: ${sense_page_fans_id}

  - id: nav_to_overrides
    then:
      - lambda: 'id(sense_nav_index) = 3;'
      - lvgl.page.show: ${sense_page_overrides_id}

  - id: nav_to_lighting_dimmers
    then:
      - lambda: 'id(sense_nav_index) = 4;'
      - lvgl.page.show: ${sense_page_lighting_dimmers_id}

  - id: nav_to_lighting_dimmers_2
    then:
      - lambda: 'id(sense_nav_index) = 5;'
      - lvgl.page.show: ${sense_page_lighting_dimmers_2_id}

  - id: nav_to_lighting_switches
    then:
      - lambda: 'id(sense_nav_index) = 6;'
      - lvgl.page.show: ${sense_page_lighting_switches_id}

  - id: nav_to_sensors
    then:
      - lambda: 'id(sense_nav_index) = 7;'
      - lvgl.page.show: ${sense_page_sensors_id}

  - id: nav_to_info
    then:
      - lvgl.page.show: ${sense_page_info_id}

  - id: nav_to_prev
    then:
      - lambda: |-
          id(sense_nav_index) = (id(sense_nav_index) + 7) % 8;
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 0;'
          then:
            - script.execute: nav_to_home
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 1;'
          then:
            - script.execute: nav_to_tstat
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 2;'
          then:
            - script.execute: nav_to_fans
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 3;'
          then:
            - script.execute: nav_to_overrides
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 4;'
          then:
            - script.execute: nav_to_lighting_dimmers
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 5;'
          then:
            - script.execute: nav_to_lighting_dimmers_2
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 6;'
          then:
            - script.execute: nav_to_lighting_switches
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 7;'
          then:
            - script.execute: nav_to_sensors

  - id: nav_to_next
    then:
      - lambda: |-
          id(sense_nav_index) = (id(sense_nav_index) + 1) % 8;
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 0;'
          then:
            - script.execute: nav_to_home
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 1;'
          then:
            - script.execute: nav_to_tstat
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 2;'
          then:
            - script.execute: nav_to_fans
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 3;'
          then:
            - script.execute: nav_to_overrides
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 4;'
          then:
            - script.execute: nav_to_lighting_dimmers
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 5;'
          then:
            - script.execute: nav_to_lighting_dimmers_2
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 6;'
          then:
            - script.execute: nav_to_lighting_switches
      - if:
          condition:
            lambda: 'return id(sense_nav_index) == 7;'
          then:
            - script.execute: nav_to_sensors

interval:
  - interval: 30s
    then:
      - lvgl.label.update:
          id: sense_topbar_date
          text: !lambda |-
            auto now = id(sense_topbar_time_src).now();
            if (!now.is_valid()) return std::string("Date --");
            return now.strftime("%a %b %d");
      - lvgl.label.update:
          id: sense_topbar_time
          text: !lambda |-
            auto now = id(sense_topbar_time_src).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%l:%M %P");
      - lvgl.label.update:
          id: sense_topbar_wifi
          text: !lambda |-
            float dbm = id(sense_topbar_wifi_db).state;
            if (isnan(dbm)) return std::string("${mdi_wifi_strength_off}");
            if (dbm >= -60.0f) return std::string("${mdi_wifi_strength_4}");
            if (dbm >= -67.0f) return std::string("${mdi_wifi_strength_3}");
            if (dbm >= -75.0f) return std::string("${mdi_wifi_strength_2}");
            if (dbm >= -85.0f) return std::string("${mdi_wifi_strength_1}");
            return std::string("${mdi_wifi_strength_off}");

lvgl:
  top_layer:
    widgets:
      - !include
        file: ../widgets/topbar-sensecap.yaml
      - !include
        file: ../widgets/bottom_nav-sensecap.yaml

