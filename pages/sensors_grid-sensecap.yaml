# =============================================================================
# PAGE EDIT GUIDE (SenseCAP)
# - Color tokens: common/color-sensecap-dani.yaml.
# - Entity/UI defaults (text/icon/value/on-off): common/ha_entities-sensecap-dani.yaml.
# - Page instance mapping (entity -> page row/column): common/package_instance_mapping-sensecap-dani.yaml.
# - Title defaults: ui_page_title_* tokens (top_level_lvgl_defualts-001-dani.yaml / ha_entities).
# - Size/shape/layout: edit this page's layout/grid_rows/grid_columns/pad_*/width/height/radius.
# - Show/hide: static with hidden:, runtime via on_load/on_state automations.
# - Text/value content: label text defaults here; live values usually update from button/template automations.
# - Runtime/interval hooks: page on_load here; shared timers/nav/time in pages/page_shell_480-sensecap.yaml.
# - Entity/attribute wiring: common/core_ha_common-sensecap.yaml and common/*ha*-sensecap*.yaml.
# - Keep page files focused on ui_* + layout; use per-page overrides only when needed.
# =============================================================================
substitutions:
  sense_page_sensors_id: "page_sensors"
  sensors_title_font: "${ui_page_title_font | default(\"nunito_36\")}"
  sensors_title_y: "${ui_page_title_y_offset | default(\"-2\")}"

lvgl:
  pages:
    - id: ${sense_page_sensors_id}
      styles: page_style
      on_load:
        - component.update: temp_f
        - component.update: ha_tstat_current_temp
        - lvgl.label.update:
            id: data_temp_f
            text: !lambda |- 
              if (isnan(id(temp_f).state)) return std::string("--");
              return str_sprintf("%.1f %s", id(temp_f).state, id(temp_f).get_unit_of_measurement_ref().c_str());
        - lvgl.label.update:
            id: data_ha_tstat_current_temp
            text: !lambda |- 
              if (isnan(id(ha_tstat_current_temp).state)) return std::string("--");
              return str_sprintf("%.1f %s", id(ha_tstat_current_temp).state, id(ha_tstat_current_temp).get_unit_of_measurement_ref().c_str());
        - lvgl.label.update:
            id: data_ha_osat_temp
            text: !lambda |- 
              if (isnan(id(ha_osat_temp).state)) return std::string("--");
              return str_sprintf("%.1f %s", id(ha_osat_temp).state, id(ha_osat_temp).get_unit_of_measurement_ref().c_str());
        - lvgl.label.update:
            id: data_ha_kitchen_temp
            text: !lambda |- 
              if (isnan(id(ha_kitchen_temp).state)) return std::string("--");
              return str_sprintf("%.1f %s", id(ha_kitchen_temp).state, id(ha_kitchen_temp).get_unit_of_measurement_ref().c_str());
        - lvgl.label.update:
            id: data_ha_freezer_temp
            text: !lambda |- 
              if (isnan(id(ha_freezer_temp).state)) return std::string("--");
              return str_sprintf("%.1f %s", id(ha_freezer_temp).state, id(ha_freezer_temp).get_unit_of_measurement_ref().c_str());
        - lvgl.label.update:
            id: data_ha_fridge_temp
            text: !lambda |- 
              if (isnan(id(ha_fridge_temp).state)) return std::string("--");
              return str_sprintf("%.1f %s", id(ha_fridge_temp).state, id(ha_fridge_temp).get_unit_of_measurement_ref().c_str());
      layout:
        type: grid
        grid_rows:
          - 34
          - FR(1)
          - FR(1)
          - FR(1)
        grid_columns:
          - FR(1)
          - FR(1)
          - FR(1)
        pad_row: 10
        pad_column: 10
      pad_top: ${sense_content_y | default("46")}
      pad_bottom: 76
      pad_left: 8
      pad_right: 8

      widgets:
        - label:
            id: sensors_page_title
            text: "Sensors"
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_column_span: 3
            grid_cell_x_align: center
            grid_cell_y_align: center
            y: ${sensors_title_y}
            text_font: ${sensors_title_font}
            styles: sense_text_title_style


