# =============================================================================
# PAGE EDIT GUIDE (SenseCAP)
# - Color tokens: common/color-sensecap-dani.yaml.
# - Entity/UI defaults (text/icon/value/on-off): common/ha_entities-sensecap-dani.yaml.
# - Page instance mapping (entity -> page row/column): common/package_instance_mapping-sensecap-dani.yaml.
# - Title defaults: ui_page_title_* tokens (top_level_lvgl_defualts-001-dani.yaml / ha_entities).
# - Size/shape/layout: edit this page's layout/grid_rows/grid_columns/pad_*/width/height/radius.
# - Show/hide: static with hidden:, runtime via on_load/on_state automations.
# - Text/value content: label text defaults here; live values usually update from button/template automations.
# - Runtime/interval hooks: page on_load here; shared timers/nav/time in pages/page_shell_480-sensecap.yaml.
# - Entity/attribute wiring: common/core_ha_common-sensecap.yaml and common/*ha*-sensecap*.yaml.
# - Keep page files focused on ui_* + layout; use per-page overrides only when needed.
# =============================================================================
substitutions:
  sense_page_display_settings_id: "page_display_settings"
  display_title_font: "${ui_page_title_font}"
  display_title_color: "${ui_page_title_color}"
  display_title_y: "${ui_page_title_y_offset}"

script:
  - id: display_settings_refresh_ui
    mode: restart
    then:
      - lvgl.slider.update: {id: display_brightness_slider, value: !lambda 'return id(sense_display_brightness_pct);', animated: false}
      - lvgl.label.update:
          id: display_brightness_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%d%%", id(sense_display_brightness_pct));
            return std::string(buf);

      - lvgl.slider.update: {id: display_idle_scroll_slider, value: !lambda 'return id(sense_display_idle_scroll_s);', animated: false}
      - lvgl.label.update:
          id: display_idle_scroll_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%ds", id(sense_display_idle_scroll_s));
            return std::string(buf);

      - lvgl.slider.update: {id: display_scroll_rate_slider, value: !lambda 'return id(sense_display_idle_scroll_rate_s);', animated: false}
      - lvgl.label.update:
          id: display_scroll_rate_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%ds", id(sense_display_idle_scroll_rate_s));
            return std::string(buf);

      - lvgl.slider.update: {id: display_sleep_timeout_slider, value: !lambda 'return id(sense_display_sleep_timeout_s);', animated: false}
      - lvgl.label.update:
          id: display_sleep_timeout_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%ds", id(sense_display_sleep_timeout_s));
            return std::string(buf);

      - lvgl.slider.update: {id: display_scroll_sleep_slider, value: !lambda 'return id(sense_display_scroll_sleep_min);', animated: false}
      - lvgl.label.update:
          id: display_scroll_sleep_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%dm", id(sense_display_scroll_sleep_min));
            return std::string(buf);
      - lvgl.dropdown.update:
          id: display_theme_dropdown
          selected_index: !lambda |-
            auto idx = id(current_theme).active_index();
            return idx.has_value() ? (int) idx.value() : 0;
      - lvgl.label.update:
          id: display_theme_status
          text: !lambda |-
            return std::string("Applied: ") + id(current_theme).current_option();

      - if:
          condition:
            lambda: 'return id(sense_display_idle_scroll_enabled);'
          then:
            - lvgl.label.update: {id: display_idle_scroll_state, text: "ON"}
            - lvgl.widget.update:
                id: display_idle_scroll_toggle
                bg_color: ${ui_display_idle_scroll_on_bg}
          else:
            - lvgl.label.update: {id: display_idle_scroll_state, text: "OFF"}
            - lvgl.widget.update:
                id: display_idle_scroll_toggle
                bg_color: ${ui_display_idle_scroll_off_bg}

      - if:
          condition:
            lambda: 'return id(sense_display_sleep_enabled);'
          then:
            - lvgl.label.update: {id: display_sleep_state, text: "ON"}
            - lvgl.widget.update:
                id: display_sleep_toggle
                bg_color: ${ui_display_sleep_on_bg}
          else:
            - lvgl.label.update: {id: display_sleep_state, text: "OFF"}
            - lvgl.widget.update:
                id: display_sleep_toggle
                bg_color: ${ui_display_sleep_off_bg}

      - if:
          condition:
            lambda: 'return id(sense_display_scroll_sleep_enabled);'
          then:
            - lvgl.label.update: {id: display_scroll_sleep_state, text: "ON"}
            - lvgl.widget.update:
                id: display_scroll_sleep_toggle
                bg_color: ${ui_display_scroll_sleep_on_bg}
          else:
            - lvgl.label.update: {id: display_scroll_sleep_state, text: "OFF"}
            - lvgl.widget.update:
                id: display_scroll_sleep_toggle
                bg_color: ${ui_display_scroll_sleep_off_bg}

lvgl:
  pages:
    - id: ${sense_page_display_settings_id}
      skip: true
      styles: sense_page_style
      on_load:
        - script.execute: display_settings_refresh_ui
      widgets:
        - label:
            text: "Display Settings"
            align: TOP_MID
            y: ${display_title_y}
            text_font: ${display_title_font}
            text_color: ${display_title_color}
        - obj:
            id: display_settings_card
            align: TOP_MID
            y: ${sense_content_y | default("46")}
            width: 100%
            height: ${sense_content_h | default("366")}
            styles: sense_card_flat_style
            widgets:

              - button:
                  id: display_brightness_label
                  align: TOP_LEFT
                  x: 14
                  y: 48
                  width: 104
                  height: 28
                  styles: sense_display_row_btn_style
                  widgets:
                    - label:
                        text: "Brightness"
                        align: CENTER
                        text_font: nunito_16
                        text_color: "${ui_page_text_color}"

              - slider:
                  id: display_brightness_slider
                  align: TOP_LEFT
                  x: 126
                  y: 56
                  width: 224
                  height: 10
                  min_value: 5
                  max_value: 100
                  bg_color: ${ui_display_slider_track_bg}
                  indicator:
                    bg_color: ${ui_display_brightness_indicator_bg}
                  knob:
                    bg_color: ${ui_display_slider_knob_bg}
                  on_value:
                    then:
                      - lambda: |-
                          id(sense_display_brightness_pct) = (int) x;
                          id(sense_display_last_interaction_ms) = millis();
                          id(sense_display_last_auto_scroll_ms) = id(sense_display_last_interaction_ms);
                          id(sense_display_scroll_sleep_start_ms) = 0;
                      - script.execute: sense_display_apply_brightness
                      - lvgl.label.update:
                          id: display_brightness_value
                          text: !lambda |-
                            char buf[12];
                            snprintf(buf, sizeof(buf), "%d%%", (int) x);
                            return std::string(buf);

              - label:
                  id: display_brightness_value
                  text: "50%"
                  align: TOP_RIGHT
                  x: -12
                  y: 50
                  text_font: nunito_18
                  text_color: "${ui_page_text_color}"

              - button:
                  id: display_idle_scroll_toggle
                  align: TOP_LEFT
                  x: 14
                  y: 82
                  width: 104
                  height: 28
                  styles: sense_display_row_btn_style
                  on_press:
                    then:
                      - lambda: |-
                          id(sense_display_idle_scroll_enabled) = !id(sense_display_idle_scroll_enabled);
                          if (id(sense_display_idle_scroll_enabled)) id(sense_display_sleep_enabled) = false;
                          id(sense_display_last_interaction_ms) = millis();
                          id(sense_display_last_auto_scroll_ms) = id(sense_display_last_interaction_ms);
                          id(sense_display_scroll_sleep_start_ms) = 0;
                      - script.execute: display_settings_refresh_ui
                  widgets:
                    - label: {text: "Scroll", align: LEFT_MID, x: 10, text_font: nunito_16, text_color: "${ui_page_text_color}"}
                    - label: {id: display_idle_scroll_state, text: "OFF", align: RIGHT_MID, x: -10, text_font: nunito_16, text_color: "${ui_page_text_color}"}

              - slider:
                  id: display_idle_scroll_slider
                  align: TOP_LEFT
                  x: 126
                  y: 90
                  width: 224
                  height: 10
                  min_value: 15
                  max_value: 300
                  bg_color: ${ui_display_slider_track_bg}
                  indicator:
                    bg_color: ${ui_display_idle_scroll_indicator_bg}
                  knob:
                    bg_color: ${ui_display_slider_knob_bg}
                  on_value:
                    then:
                      - lambda: |-
                          id(sense_display_idle_scroll_s) = (int) x;
                          id(sense_display_last_interaction_ms) = millis();
                      - lvgl.label.update:
                          id: display_idle_scroll_value
                          text: !lambda |-
                            char buf[12];
                            snprintf(buf, sizeof(buf), "%ds", (int) x);
                            return std::string(buf);

              - label:
                  id: display_idle_scroll_value
                  text: "30s"
                  align: TOP_RIGHT
                  x: -12
                  y: 84
                  text_font: nunito_18
                  text_color: "${ui_page_text_color}"

              - button:
                  id: display_scroll_rate_label
                  align: TOP_LEFT
                  x: 14
                  y: 116
                  width: 104
                  height: 28
                  styles: sense_display_row_btn_style
                  widgets:
                    - label:
                        text: "Rate"
                        align: CENTER
                        text_font: nunito_16
                        text_color: "${ui_page_text_color}"

              - slider:
                  id: display_scroll_rate_slider
                  align: TOP_LEFT
                  x: 126
                  y: 124
                  width: 224
                  height: 10
                  min_value: 1
                  max_value: 30
                  bg_color: ${ui_display_slider_track_bg}
                  indicator:
                    bg_color: ${ui_display_scroll_rate_indicator_bg}
                  knob:
                    bg_color: ${ui_display_slider_knob_bg}
                  on_value:
                    then:
                      - lambda: |-
                          id(sense_display_idle_scroll_rate_s) = (int) x;
                          id(sense_display_last_interaction_ms) = millis();
                      - lvgl.label.update:
                          id: display_scroll_rate_value
                          text: !lambda |-
                            char buf[12];
                            snprintf(buf, sizeof(buf), "%ds", (int) x);
                            return std::string(buf);

              - label:
                  id: display_scroll_rate_value
                  text: "5s"
                  align: TOP_RIGHT
                  x: -12
                  y: 118
                  text_font: nunito_18
                  text_color: "${ui_page_text_color}"

              - button:
                  id: display_sleep_toggle
                  align: TOP_LEFT
                  x: 14
                  y: 150
                  width: 104
                  height: 28
                  styles: sense_display_row_btn_style
                  on_press:
                    then:
                      - lambda: |-
                          id(sense_display_sleep_enabled) = !id(sense_display_sleep_enabled);
                          if (id(sense_display_sleep_enabled)) id(sense_display_idle_scroll_enabled) = false;
                          id(sense_display_last_interaction_ms) = millis();
                          id(sense_display_last_auto_scroll_ms) = id(sense_display_last_interaction_ms);
                          id(sense_display_scroll_sleep_start_ms) = 0;
                          if (!id(sense_display_sleep_enabled) && id(sense_display_screen_off)) {
                            id(sense_display_screen_off) = false;
                          }
                      - if:
                          condition:
                            lambda: 'return !id(sense_display_sleep_enabled);'
                          then:
                            - lvgl.resume:
                            - lvgl.widget.redraw
                            - script.execute: sense_display_apply_brightness
                      - script.execute: display_settings_refresh_ui
                  widgets:
                    - label: {text: "Sleep", align: LEFT_MID, x: 10, text_font: nunito_16, text_color: "${ui_page_text_color}"}
                    - label: {id: display_sleep_state, text: "ON", align: RIGHT_MID, x: -10, text_font: nunito_16, text_color: "${ui_page_text_color}"}

              - slider:
                  id: display_sleep_timeout_slider
                  align: TOP_LEFT
                  x: 126
                  y: 158
                  width: 224
                  height: 10
                  min_value: 15
                  max_value: 300
                  bg_color: ${ui_display_slider_track_bg}
                  indicator:
                    bg_color: ${ui_display_sleep_timeout_indicator_bg}
                  knob:
                    bg_color: ${ui_display_slider_knob_bg}
                  on_value:
                    then:
                      - lambda: |-
                          id(sense_display_sleep_timeout_s) = (int) x;
                          id(sense_display_last_interaction_ms) = millis();
                      - lvgl.label.update:
                          id: display_sleep_timeout_value
                          text: !lambda |-
                            char buf[12];
                            snprintf(buf, sizeof(buf), "%ds", (int) x);
                            return std::string(buf);

              - label:
                  id: display_sleep_timeout_value
                  text: "60s"
                  align: TOP_RIGHT
                  x: -12
                  y: 152
                  text_font: nunito_18
                  text_color: "${ui_page_text_color}"

              - button:
                  id: display_scroll_sleep_toggle
                  align: TOP_LEFT
                  x: 14
                  y: 184
                  width: 104
                  height: 28
                  styles: sense_display_row_btn_style
                  on_press:
                    then:
                      - lambda: |-
                          id(sense_display_scroll_sleep_enabled) = !id(sense_display_scroll_sleep_enabled);
                          id(sense_display_last_interaction_ms) = millis();
                          id(sense_display_last_auto_scroll_ms) = id(sense_display_last_interaction_ms);
                          id(sense_display_scroll_sleep_start_ms) = 0;
                      - script.execute: display_settings_refresh_ui
                  widgets:
                    - label: {text: "Scroll Sleep", align: LEFT_MID, x: 10, text_font: nunito_16, text_color: "${ui_page_text_color}"}
                    - label: {id: display_scroll_sleep_state, text: "OFF", align: RIGHT_MID, x: -10, text_font: nunito_16, text_color: "${ui_page_text_color}"}

              - slider:
                  id: display_scroll_sleep_slider
                  align: TOP_LEFT
                  x: 126
                  y: 192
                  width: 224
                  height: 10
                  min_value: 15
                  max_value: 120
                  bg_color: ${ui_display_slider_track_bg}
                  indicator:
                    bg_color: ${ui_display_scroll_sleep_indicator_bg}
                  knob:
                    bg_color: ${ui_display_slider_knob_bg}
                  on_value:
                    then:
                      - lambda: |-
                          id(sense_display_scroll_sleep_min) = (int) x;
                          id(sense_display_last_interaction_ms) = millis();
                      - lvgl.label.update:
                          id: display_scroll_sleep_value
                          text: !lambda |-
                            char buf[12];
                            snprintf(buf, sizeof(buf), "%dm", (int) x);
                            return std::string(buf);

              - label:
                  id: display_scroll_sleep_value
                  text: "30m"
                  align: TOP_RIGHT
                  x: -12
                  y: 186
                  text_font: nunito_18
                  text_color: "${ui_page_text_color}"

              - button:
                  id: display_theme_label
                  align: TOP_LEFT
                  x: 14
                  y: 218
                  width: 104
                  height: 28
                  styles: sense_display_row_btn_style
                  widgets:
                    - label:
                        text: "Theme"
                        align: CENTER
                        text_font: nunito_16
                        text_color: "${ui_page_text_color}"

              - dropdown:
                  id: display_theme_dropdown
                  align: TOP_LEFT
                  x: 126
                  y: 216
                  width: 224
                  height: 32
                  text_font: montserrat_14
                  options:
                    - "Dark"
                    - "Dani"
                    - "Split"
                  selected_index: 1
                  on_value:
                    then:
                      - select.set:
                          id: current_theme
                          option: !lambda |-
                            if (x == 1) return std::string("Dani");
                            if (x == 2) return std::string("Split");
                            return std::string("Dark");
                      - script.execute: display_settings_refresh_ui

              - label:
                  id: display_theme_status
                  text: "Applied: Dani"
                  align: TOP_LEFT
                  x: 126
                  y: 252
                  text_font: nunito_14
                  text_color: "${ui_page_text_color}"



















