# =============================================================================
# PAGE EDIT GUIDE (SenseCAP)
# - Color tokens: common/color-sensecap-dani.yaml.
# - Entity/UI defaults (text/icon/value/on-off): common/ha_entities-sensecap-dani.yaml.
# - Page instance mapping (entity -> page row/column): common/package_instance_mapping-sensecap-dani.yaml.
# - Title defaults: ui_page_title_* tokens (top_level_lvgl_defualts-001-dani.yaml / ha_entities).
# - Size/shape/layout: edit this page's layout/grid_rows/grid_columns/pad_*/width/height/radius.
# - Show/hide: static with hidden:, runtime via on_load/on_state automations.
# - Text/value content: label text defaults here; live values usually update from button/template automations.
# - Runtime/interval hooks: page on_load here; shared timers/nav/time in pages/page_shell_480-sensecap.yaml.
# - Entity/attribute wiring: common/core_ha_common-sensecap.yaml and common/*ha*-sensecap*.yaml.
# - Keep page files focused on ui_* + layout; use per-page overrides only when needed.
# =============================================================================
substitutions:
  menu_text_color: "${ui_page_text_color}"
  menu_cat_admin_style:  sense_menu_cat1_style
  menu_cat_climate_style: sense_menu_cat2_style
  menu_cat_lights_style: sense_menu_cat3_style
  menu_cat_overrides_style: sense_menu_cat4_style

lvgl:
  pages:
    - id: page_menu
      skip: true
      styles: sense_page_style
      widgets:
        - obj:
            id: menu_grid_card
            align: TOP_MID
            y: ${sense_content_y | default("46")}
            width: 100%
            height: ${sense_content_h | default("366")}
            styles: sense_card_flat_style
            layout:
              type: GRID
              grid_rows: [FR(1), FR(1), FR(1), FR(1)]
              grid_columns: [FR(1), FR(1), FR(1)]
              pad_row: 10
              pad_column: 10
            widgets:
              - button:
                  id: menu_btn_home
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_climate_style}
                  on_press:
                    - script.execute: nav_to_home
                  widgets:
                    - label:
                        text: "Home"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_tstat
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_climate_style}
                  on_press:
                    - script.execute: nav_to_tstat
                  widgets:
                    - label:
                        text: "Thermostat"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_fans
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_climate_style}
                  on_press:
                    - script.execute: nav_to_fans
                  widgets:
                    - label:
                        text: "Fans"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_sensors
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_climate_style}
                  on_press:
                    - script.execute: nav_to_sensors
                  widgets:
                    - label:
                        text: "Sensors"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_lights
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_lights_style}
                  on_press:
                    - script.execute: nav_to_lighting_switches
                  widgets:
                    - label:
                        text: "Lights"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_dimmers
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_lights_style}
                  on_press:
                    - script.execute: nav_to_lighting_dimmers
                  widgets:
                    - label:
                        text: "Dimmers"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_overrides
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_overrides_style}
                  on_press:
                    - script.execute: nav_to_overrides
                  widgets:
                    - label:
                        text: "Overrides"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_display
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_admin_style}
                  on_press:
                    - script.execute: nav_to_display_settings
                  widgets:
                    - label:
                        text: "Display"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_dimmers_2
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_lights_style}
                  on_press:
                    - script.execute: nav_to_lighting_dimmers_2
                  widgets:
                    - label:
                        text: "Dimmers 2"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_wifi
                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_admin_style}
                  on_press:
                    - script.execute: nav_to_wifi
                  widgets:
                    - label:
                        text: "WiFi Setup"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}
              - button:
                  id: menu_btn_info
                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: ${menu_cat_admin_style}
                  on_press:
                    - script.execute: nav_to_info
                  widgets:
                    - label:
                        text: "Info"
                        align: CENTER
                        text_font: nunito_18
                        text_color: ${menu_text_color}


