---
# Non-clickable placeholder tile
# vars:
#    uid:
#    page_id:
#    row:
#    column:
#    row_span:
#    column_span:
#    text:
#    icon:
#    bg_color: (optional)
#    icon_color: (optional)
#    text_color: (optional)

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}
                  clickable: false
                  bg_color: ${bg_color | default("sense_surface_alt")}
                  widgets:
                    - label:
                        id: icon_${uid}
                        text_font: $icon_font
                        align: top_left
                        x: 10
                        y: 8
                        text: ${icon}
                        text_color: ${icon_color | default("sense_tile_placeholder_text")}
                    - label:
                        id: label_${uid}
                        align: left_mid
                        x: 42
                        text_font: nunito_16
                        text: ${text}
                        text_color: ${text_color | default("sense_tile_placeholder_text")}


