---
# Override toggle button with icon + text + value (ON/OFF)
# vars:
#   uid:
#   page_id:
#   row:
#   column:
#   row_span:
#   column_span:
#   text:
#   icon:
#   entity_id:
#   value_on:
#   value_off:
#   on_bg_color: (optional)
#   off_bg_color: (optional)
#   on_icon: (optional)
#   off_icon: (optional)

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}
                  width: 100%
                  height: 100%
                  radius: 8
                  pad_left: 8
                  pad_right: 8
                  pad_top: 4
                  pad_bottom: 4
                  layout:
                    type: grid
                    grid_rows: [fr(1)]
                    grid_columns: [content, fr(1), content]
                  widgets:
                    - label:
                        id: icon_${uid}
                        text_font: $icon_font
                        text: ${icon}
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 0
                        grid_cell_x_align: start
                        grid_cell_y_align: center
                    - label:
                        id: label_${uid}
                        text_font: nunito_14
                        text: ${text}
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 1
                        grid_cell_x_align: start
                        grid_cell_y_align: center
                    - label:
                        id: value_${uid}
                        text_font: nunito_18
                        text: ${value_off | default("OFF")}
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 2
                        grid_cell_x_align: end
                        grid_cell_y_align: center
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: ${entity_id}

binary_sensor:
  - id: widget_sensor_${uid}
    platform: homeassistant
    entity_id: ${entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_${uid}
          then:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: $button_on_color
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_on_color
                bg_color: ${on_bg_color | default("$button_on_color")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_on_color
            - if:
                condition:
                  lambda: 'return std::string("${on_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: icon_${uid}
                      text: ${on_icon | default("")}
            - lvgl.widget.update:
                id: label_${uid}
                text_color: $label_on_color
            - lvgl.label.update:
                id: value_${uid}
                text: ${value_on | default("ON")}
            - lvgl.widget.update:
                id: value_${uid}
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: $button_off_color
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_off_color
                bg_color: ${off_bg_color | default("$button_off_color")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_off_color
            - if:
                condition:
                  lambda: 'return std::string("${off_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: icon_${uid}
                      text: ${off_icon | default("")}
            - lvgl.widget.update:
                id: label_${uid}
                text_color: $label_off_color
            - lvgl.label.update:
                id: value_${uid}
                text: ${value_off | default("OFF")}
            - lvgl.widget.update:
                id: value_${uid}
                text_color: $label_off_color
