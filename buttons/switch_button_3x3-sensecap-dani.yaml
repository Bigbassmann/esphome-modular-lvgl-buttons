# FILE EDIT GUIDE (SenseCAP)
# Role: Reusable button template (structure + behavior hooks).
# Update here for:
# - Size/shape defaults: width/height/radius/padding/alignment.
# - Show/hide behavior flags for icon/text/value/state widgets.
# - Runtime logic: on_press, on_value, lambda/then blocks, intervals.
# Keep entity wiring out of this file:
# - Entity/attribute mapping belongs in common/ha_entities-*.yaml.
# - Page placement/layout belongs in pages/*-sensecap*.yaml.
# - Color defaults should resolve via shared theme styles/tokens first, with per-page overrides only when needed.
---
# 3x3 lights switch tile (icon top-left, value center, title bottom-mid)
# vars:
#   uid, page_id, row, column, row_span, column_span, text, icon, entity_id
#   secondary_entity_id (optional), on_bg_color (optional), off_bg_color (optional)
#   value_on_text (optional), value_off_text (optional)

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}
                  styles: sense_nav_btn_style
                  widgets:
                    - label:
                        id: icon_${uid}
                        text: ${icon}
                        text_font: $icon_font
                        align: top_left
                        x: 8
                        y: 6
                        styles: sense_text_primary_style
                    - label:
                        id: value_${uid}
                        text: ${value_off_text | default("OFF")}
                        text_font: nunito_20
                        align: center
                        styles: sense_text_primary_style
                    - label:
                        id: label_${uid}
                        text: ${text}
                        text_font: nunito_16
                        align: bottom_mid
                        y: -6
                        styles: sense_text_primary_style
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: ${entity_id}
                    - if:
                        condition:
                          lambda: 'return std::string("${secondary_entity_id | default("")}").size() > 0;'
                        then:
                          - homeassistant.action:
                              action: homeassistant.toggle
                              data:
                                entity_id: ${secondary_entity_id | default("")}

binary_sensor:
  - id: widget_sensor_${uid}
    platform: homeassistant
    entity_id: ${entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_${uid}
          then:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: ${on_bg_color | default("theme_display_row_btn_bg_default")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: ${ui_state_text_active_color}
            - lvgl.widget.update:
                id: label_${uid}
                text_color: ${ui_state_text_active_color}
            - lvgl.label.update:
                id: value_${uid}
                text: ${value_on_text | default("ON")}
            - lvgl.widget.update:
                id: value_${uid}
                text_color: ${ui_state_text_active_color}
          else:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: ${off_bg_color | default("theme_nav_btn_bg_default")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: ${ui_state_text_inactive_color}
            - lvgl.widget.update:
                id: label_${uid}
                text_color: ${ui_state_text_inactive_color}
            - lvgl.label.update:
                id: value_${uid}
                text: ${value_off_text | default("OFF")}
            - lvgl.widget.update:
                id: value_${uid}
                text_color: ${ui_state_text_inactive_color}



