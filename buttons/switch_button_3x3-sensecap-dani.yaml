---
# 3x3 lights switch tile (icon top-left, value center, title bottom-mid)
# vars:
#   uid, page_id, row, column, row_span, column_span, text, icon, entity_id
#   secondary_entity_id (optional), on_bg_color (optional), off_bg_color (optional)
#   value_on_text (optional), value_off_text (optional)

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}
                  widgets:
                    - label:
                        id: icon_${uid}
                        text: ${icon}
                        text_font: $icon_font
                        align: top_left
                        x: 8
                        y: 6
                    - label:
                        id: value_${uid}
                        text: ${value_off_text | default("OFF")}
                        text_font: nunito_20
                        align: center
                    - label:
                        id: label_${uid}
                        text: ${text}
                        text_font: nunito_16
                        align: bottom_mid
                        y: -6
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: ${entity_id}
                    - if:
                        condition:
                          lambda: 'return std::string("${secondary_entity_id | default("")}").size() > 0;'
                        then:
                          - homeassistant.action:
                              action: homeassistant.toggle
                              data:
                                entity_id: ${secondary_entity_id | default("")}

binary_sensor:
  - id: widget_sensor_${uid}
    platform: homeassistant
    entity_id: ${entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_${uid}
          then:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: ${on_bg_color | default("$button_on_color")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_on_color
            - lvgl.widget.update:
                id: label_${uid}
                text_color: $label_on_color
            - lvgl.label.update:
                id: value_${uid}
                text: ${value_on_text | default("ON")}
            - lvgl.widget.update:
                id: value_${uid}
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: ${off_bg_color | default("$button_off_color")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_off_color
            - lvgl.widget.update:
                id: label_${uid}
                text_color: $label_off_color
            - lvgl.label.update:
                id: value_${uid}
                text: ${value_off_text | default("OFF")}
            - lvgl.widget.update:
                id: value_${uid}
                text_color: $label_off_color
