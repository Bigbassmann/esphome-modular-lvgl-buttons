# FILE EDIT GUIDE (SenseCAP)
# Role: Reusable button template (structure + behavior hooks).
# Update here for:
# - Size/shape defaults: width/height/radius/padding/alignment.
# - Show/hide behavior flags for icon/text/value/state widgets.
# - Runtime logic: on_press, on_value, lambda/then blocks, intervals.
# Keep entity wiring out of this file:
# - Entity/attribute mapping belongs in common/ha_entities-*.yaml.
# - Page placement/layout belongs in pages/*-sensecap*.yaml.
# - Color defaults should resolve via ui_* vars and family color tokens.
---
# Switch (or light) toggle button
# vars:
#    uid:
#    page_id:
#    row:
#    column:
#    row_span:
#    column_span:
#    text:
#    icon:
#    entity_id:
#    secondary_entity_id: (optional)
#    on_bg_color: (optional)
#    off_bg_color: (optional)

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}
                  widgets:
                    - label:
                        text_font: $icon_font
                        align: top_left
                        x: 8
                        y: 8
                        id: icon_${uid}
                        text: ${icon}
                    - label:
                        align: bottom_left
                        x: 8
                        y: -6
                        text_font: nunito_16
                        id: label_${uid}
                        text: ${text}
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: ${entity_id}
                    - if:
                        condition:
                          lambda: 'return std::string("${secondary_entity_id | default("")}").size() > 0;'
                        then:
                          - homeassistant.action:
                              action: homeassistant.toggle
                              data:
                                entity_id: ${secondary_entity_id | default("")}

binary_sensor:
  - id: widget_sensor_${uid}
    platform: homeassistant
    entity_id: ${entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_${uid}
          then:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: ${on_bg_color | default("${ui_base_button_on_color}")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: ${ui_base_icon_on_color}
            - lvgl.widget.update:
                id: label_${uid}
                text_color: ${ui_base_label_on_color}
          else:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: ${off_bg_color | default("${ui_base_button_off_color}")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: ${ui_base_icon_off_color}
            - lvgl.widget.update:
                id: label_${uid}
                text_color: ${ui_base_label_off_color}



